name: Investment Twelve Engine Workflow
on:
  push:
    branches:
      - feature/investment-12-engine-workflow
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/investment-workflow.yml"
      - "investment_studio/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investment-dag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python backend tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" numpy pandas
      - name: Test original function API and investment DAG
        run: |
          python -m pytest -q \
            tests/test_investment_workflow.py \
            tests/test_alpha_engine_api.py \
            tests/test_alpha_graph.py \
            tests/test_alpha_services.py \
            tests/test_alpha_palette.py \
            tests/test_orchestration.py tests/test_api.py
      - name: Verify native function and workflow route counts
        run: |
          python - <<'PY'
          from app.main import app
          from app.alpha_nodes.inventory import ENGINES, OPERATIONS
          from app.alpha_nodes.investment_flow import palette
          paths = app.openapi()["paths"]
          assert len(ENGINES) == 12
          assert len(OPERATIONS) == 137
          for operation in OPERATIONS:
              assert operation["endpoint"] in paths
          assert "/api/v1/alpha/investment/node-types" in paths
          assert "/api/v1/alpha/investment/workflows/{workflow_id}/runs" in paths
          assert "/api/v1/alpha/investment/runs/{run_id}/nodes/{node_id}/approve" in paths
          print("ENGINE_COUNT",len(ENGINES))
          print("FUNCTION_ENDPOINTS",len(OPERATIONS))
          print("PALETTE_NODES",len(palette()["nodes"]))
          PY

  react-node-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install React Flow studio
        working-directory: investment_studio
        run: npm install --no-audit --no-fund
      - name: Type-check and bundle
        working-directory: investment_studio
        run: npm run build
      - name: Confirm actual API-backed editor
        run: |
          node - <<'JS'
          const fs=require('fs');
          const ui=fs.readFileSync('investment_studio/src/InvestmentStudio.tsx','utf8');
          for(const name of ['/node-types','/workflows','/runs','ReactFlow','target_input','output_path','QUORUM','ALL_SETTLED','waiting_approval']) {
             if(!ui.includes(name))throw new Error('Missing node studio feature: '+name);
          }
          if(ui.includes('exampleData(')||ui.includes('sampleRun('))throw new Error('Found fabricated demo market-data runner');
          console.log('Real API-backed investment editor verified');
          JS
