name: TradingView KG - ChatGPT research task PREPARE ONLY

on:
  push:
    branches:
      - feature/chatgpt-kg-research-orchestration-20261117
    paths:
      - research/**
      - .github/workflows/kg-research-prepare.yml
  workflow_dispatch:
    inputs:
      strategy_id:
        description: TradingView 전략 ID (현재 시드 목록에 등록된 ID)
        required: true
        type: string
        default: 02yfhjiz

permissions:
  contents: read

concurrency:
  group: kg-research-preparation
  cancel-in-progress: false

jobs:
  prepare-chatgpt-task:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pick exactly one source from the seed queue
        env:
          TV_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy_id || '02yfhjiz' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -c --arg id "$TV_ID" 'select(.strategy_id == $id)' research/queue/seed.jsonl > selected.jsonl
          if [ "$(wc -l < selected.jsonl)" -ne 1 ]; then
            echo 'ERROR: Strategy ID must exist exactly once in seed queue.' >&2
            exit 1
          fi
          cp selected.jsonl selected-strategy.json
          {
            printf '# 연구 대상 원본\n'
            cat selected-strategy.json
            printf '\n# 공통 지시문\n'
            cat research/prompts/COMMON_KG_RESEARCH.md
            printf '\n# 단계별 작업 지시문\n'
            cat research/prompts/STAGE_TASKS.md
            printf '\n# 실패 시 반드시 반복 재생성\n'
            cat research/prompts/REBUILD_UNTIL_PASS.md
          } > CHATGPT_RESEARCH_TASK.md
          {
            echo '## ChatGPT 연구 작업 준비 결과'
            echo ''
            echo '- 상태: **PREPARED_ONLY**'
            echo '- AI 검색·지식그래프 생성·역복원은 아직 실행되지 않았습니다.'
            echo '- 다음 단계: HITEL 연동 지침에 따른 ChatGPT 작업 전달기를 연결하십시오.'
            echo '- 실패 발생 시 그래프 기존판을 비활성화하고 원문 사실에서 전체 재구성하며 블라인드 역재현까지 반복합니다.'
            echo ''
            echo '```json'
            cat selected-strategy.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-research-prepared-${{ github.event_name == 'workflow_dispatch' && inputs.strategy_id || '02yfhjiz' }}
          path: |
            CHATGPT_RESEARCH_TASK.md
            selected-strategy.json
          retention-days: 30
