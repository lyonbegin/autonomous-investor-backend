name: Test no-login n8n gateway landing
on:
  push:
    branches: [feature/public-demo-readonly-20261025]
    paths:
      - 'n8n/Caddyfile.native-editor-gateway'
      - 'n8n/Dockerfile.native-editor-gateway'
      - '.github/workflows/test-native-editor-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway Caddy image
        run: docker build -f n8n/Dockerfile.native-editor-gateway -t native-n8n-proxy:ci .
      - name: Verify no browser-auth prompt and deny administrative endpoints
        run: |
          docker run -d --name native-n8n-proxy -p 38081:3000 -e PORT=3000 native-n8n-proxy:ci
          trap 'docker rm -f native-n8n-proxy >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do if curl -fsS http://localhost:38081/health >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://localhost:38081/health
          curl -sSD /tmp/home-headers -o /dev/null http://localhost:38081/
          grep -q '^HTTP/1.1 302' /tmp/home-headers
          grep -qi '^Location: https://investment-n8n-operations-ui-production.up.railway.app/' /tmp/home-headers
          if grep -qi '^WWW-Authenticate:' /tmp/home-headers; then echo 'Browser auth challenge is still present'; exit 1; fi
          for path in /setup /rest/settings /rest/workflows /api/v1/workflows /workflow/aiOperationF01; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:38081$path")
            test "$code" = 403 || { echo "Unexpected $path $code"; exit 1; }
          done
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' http://localhost:38081/)
          test "$code" = 403
          echo 'PASS: no login challenge; n8n administration not exposed'
