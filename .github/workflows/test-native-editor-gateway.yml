name: Test native n8n editor gateway
on:
  push:
    branches: [feature/public-demo-readonly-20261025]
    paths:
      - 'n8n/Caddyfile.native-editor-gateway'
      - 'n8n/Dockerfile.native-editor-gateway'
      - '.github/workflows/test-native-editor-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native editor gateway
        run: docker build -f n8n/Dockerfile.native-editor-gateway -t native-n8n-proxy:ci .
      - name: Require login before proxying to private n8n
        run: |
          HASH=$(docker run --rm caddy:2.10-alpine caddy hash-password --plaintext test-only-ci-password)
          docker run -d --name native-n8n-proxy -p 38081:3000 -e PORT=3000 -e N8N_GATEWAY_USER=tester -e N8N_GATEWAY_PASSWORD_HASH="$HASH" native-n8n-proxy:ci
          trap 'docker rm -f native-n8n-proxy >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://localhost:38081/health && break || sleep 1; done
          for path in / /setup /rest/settings /rest/workflows /api/v1/workflows; do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:38081$path")
            test "$STATUS" = 401 || { echo "UNPROTECTED $path $STATUS"; exit 1; }
            echo "SECURED $path status 401"
          done
          STATUS=$(curl -sS -u tester:test-only-ci-password -o /dev/null -w '%{http_code}' http://localhost:38081/)
          test "$STATUS" = 502 || { echo "Unexpected valid auth proxy response $STATUS"; exit 1; }
          echo "PASS: original n8n upstream only available after Basic Auth"
