name: n8n Scenario Control Plane

on:
  push:
    branches: [feature/n8n-scenario-control-plane]
    paths:
      - "app/**"
      - "tests/**"
      - "n8n_scenarios/**"
      - "investment_studio/**"
      - ".github/workflows/n8n-scenarios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" numpy pandas
      - name: Run 10 scenario engines and original operation tests
        run: |
          python -m pytest -q \
            tests/test_n8n_scenarios.py \
            tests/test_investment_workflow.py \
            tests/test_alpha_engine_api.py \
            tests/test_alpha_graph.py \
            tests/test_alpha_services.py \
            tests/test_alpha_palette.py \
            tests/test_orchestration.py tests/test_api.py
      - name: Generate 10 n8n executable workflow definitions
        run: |
          python n8n_scenarios/build_workflows.py
          python - <<'PY'
          import json
          from pathlib import Path
          from app.alpha_nodes.scenario_catalog import SCENARIOS
          files=sorted(Path("n8n_scenarios/workflows").glob("*.json"))
          assert len(files)==10, files
          for i,p in enumerate(files,1):
              obj=json.loads(p.read_text())
              assert obj["id"]==f"INVESTSCENARIO{i:02d}"
              assert len(obj["nodes"])==len(SCENARIOS[i]["steps"])+1
              assert obj["connections"]
          print("TEN_N8N_EXECUTABLE_GRAPHS_VALIDATED",len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: n8n-ten-scenario-workflows
          path: n8n_scenarios/workflows/*.json
          retention-days: 14

  scenario-react:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install React workflow studio
        working-directory: investment_studio
        run: npm install --no-audit --no-fund
      - name: Build scenario timeline and investment studio
        working-directory: investment_studio
        run: npm run build
