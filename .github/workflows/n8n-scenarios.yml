name: n8n Ten Scenario Console
on:
  push:
    branches: [feature/n8n-real-worker-e2e]
    paths:
      - "app/**"
      - "tests/**"
      - "investment_studio/**"
      - "n8n/**"
      - ".github/workflows/n8n-scenarios.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -e ".[dev]" numpy pandas
      - name: Ten scenario API executions and old native DAG regression
        run: |
          python -m pytest -q tests/test_n8n_scenarios.py tests/test_n8n_gateway.py tests/test_investment_workflow.py tests/test_alpha_engine_api.py tests/test_alpha_graph.py tests/test_alpha_services.py tests/test_alpha_palette.py tests/test_orchestration.py tests/test_api.py
      - name: Verify n8n workflows and operation safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.main import app
          from app.alpha_nodes.scenario_simulator import SCENARIOS
          files=list(Path('n8n/workflows/scenarios').glob('*.json'))
          assert len(files)==len(SCENARIOS)==10
          for path in files:
              doc=json.loads(path.read_text())
              assert path.stem in SCENARIOS
              assert len(doc['nodes'])==6
              assert any(n['type']=='n8n-nodes-base.webhook' for n in doc['nodes'])
              assert any(n['type']=='n8n-nodes-base.respondToWebhook' for n in doc['nodes'])
              assert any(n['type']=='n8n-nodes-base.manualTrigger' for n in doc['nodes'])
              assert SCENARIOS[path.stem]['title']
              http = [n for n in doc['nodes'] if n['type']=='n8n-nodes-base.httpRequest']
              assert len(http)==2
              assert http[0]['parameters']['method']=='POST'
              assert http[0]['parameters']['authentication']=='genericCredentialType'
              assert http[1]['parameters']['method']=='GET'
          paths=app.openapi()['paths']
          assert '/api/v1/alpha/scenarios/{scenario_id}/runs' in paths
          assert '/api/v1/alpha/scenarios/runs/{run_id}' in paths
          print('TEN_N8N_WORKFLOWS_VALIDATED',len(files))
          PY
  react-console:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - working-directory: investment_studio
        run: npm install --no-audit --no-fund
      - name: TypeScript and Vite production bundle
        working-directory: investment_studio
        run: npm run build

  n8n-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose config
        env:
          N8N_DB_PASSWORD: ci-test-only
          N8N_REDIS_PASSWORD: ci-test-only
          N8N_ENCRYPTION_KEY: ci-test-only-n8n-encryption-key-32bytes
        run: |
          docker compose -f n8n/docker-compose.yml config --quiet
          ALPHA_NODE_API_KEY=ci-not-real docker compose -f n8n/docker-compose.yml -f n8n/docker-compose.backend.yml config --quiet
      - name: Start actual pinned n8n image CLI
        run: |
          docker run --rm docker.n8n.io/n8nio/n8n:2.44.5 --version

  actual-n8n-queue-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]" numpy pandas
      - name: Verify real n8n Webhook, Redis Worker, Python API and n8n execution DB
        run: bash n8n/scripts/run_real_n8n_e2e.sh
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-n8n-worker-evidence
          path: |
            /tmp/n8n-e2e-evidence.json
            /tmp/n8n-ci-backend.log
          if-no-files-found: ignore

  python-backend-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root self-hosted backend image
        run: docker build -f n8n/Dockerfile.backend -t investment-sim-backend:ci .
      - name: Run and query authenticated Python API in real container
        run: |
          docker run -d --name investment-smoke             -p 127.0.0.1:8013:8000             -e ALPHA_NODE_API_KEY=ci-backend-smoke-key             investment-sim-backend:ci
          trap 'docker logs investment-smoke; docker rm -f investment-smoke || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS -H "Authorization: Bearer ci-backend-smoke-key"               http://127.0.0.1:8013/api/v1/alpha/scenarios > /tmp/backend-smoke.json; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/backend-smoke.json'))
          assert payload['count']==10
          assert payload['scenarios'][0]['mode']=='SYNTHETIC_SIMULATION'
          print('DOCKERIZED_PYTHON_BACKEND_SCENARIOS',payload['count'])
          PY

  chromium-click-through:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install backend and React test dependencies
        run: |
          python -m pip install -e ".[dev]" numpy pandas
          cd investment_studio && npm install --no-audit --no-fund
      - name: Install Chromium browser
        working-directory: investment_studio
        run: npx playwright install --with-deps chromium
      - name: Click and inspect all 10 scenarios in actual Chromium
        run: |
          export ALPHA_NODE_API_KEY=ci-playwright-browser-token
          export SCENARIO_DB_PATH=/tmp/ci-browser-scenarios.sqlite3
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/browser-backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill "$BACKEND_PID" 2>/dev/null || true' EXIT
          cd investment_studio
          INVESTMENT_STUDIO_BACKEND_URL=http://127.0.0.1:8000 \
          INVESTMENT_STUDIO_API_TOKEN="$ALPHA_NODE_API_KEY" \
          npm run dev -- --host 127.0.0.1 --port 5177 > /tmp/browser-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" "$BACKEND_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5177/ >/dev/null 2>&1 &&
               curl -fsS -H "Authorization: Bearer $ALPHA_NODE_API_KEY" \
                 http://127.0.0.1:8000/api/v1/alpha/scenarios >/dev/null 2>&1; then break; fi
            sleep 2
          done
          npx playwright test --project=chromium
      - name: Save actual UI progress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-ten-scenario-screenshots
          path: |
            investment_studio/test-results/
            /tmp/browser-backend.log
            /tmp/browser-vite.log
          if-no-files-found: ignore
