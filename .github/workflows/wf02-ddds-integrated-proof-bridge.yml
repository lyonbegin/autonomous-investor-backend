name: WF02 DDDS integrated SHA and actual same-site Python bridge
on:
  push:
    branches: [feature/wf02-bridge-real-ddds-verified-site-20261104]
  pull_request:
    branches: [feature/admin-verified-strategies-catalog-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimum existing pipeline deps
        run: python -m pip install "psycopg[binary]>=3.2,<4" "beautifulsoup4==4.13.4"
      - name: Compile actual integrated node pipeline + 300-bar SHA bridge
        run: python -m py_compile n8n/editor-adapter/investment_pipeline.py n8n/editor-adapter/investment_pipeline_ddds_bridge.py
      - name: DDDS exact source/converted Python/300 site bars/previous Vela proof regression
        run: python n8n/tests/test_ddds_integrated_bridge.py -v
      - name: Verify existing admin JS with live comparison embedding
        run: node n8n/tests/test_verified_admin_static.cjs
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build exactly the Railway production Docker with all Python tests
        run: docker build -f n8n/Dockerfile.native-editor-gateway -t ddss-bridge:test .
      - name: Ensure production imports SHA bridge and migrated Vela comparison
        run: |
          docker run --rm --entrypoint sh ddss-bridge:test -c 'test -s /app/investment_pipeline_ddds_bridge.py && test -s /app/dist/verified/index.html && test -s /app/dist/admin/index.html'

  live-integrated-four-stages:
    concurrency:
      group: actual-DDDS-production-four-stage-only-one-at-a-time
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium to actually operate the production node admin screen
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Select exact DDDS and execute WF01/WF02 real four-stage node run
        env:
          INTEGRATED_DDDS_EVIDENCE: /tmp/wf02-ddds-live-four-stages
        run: |
          node --check n8n/tests/e2e_integrated_ddds_4stage.cjs
          node n8n/tests/e2e_integrated_ddds_4stage.cjs
      - name: Upload actual node states and live Pine/Python visible chart screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-DDDS-four-stage-actual-run-and-charts
          path: /tmp/wf02-ddds-live-four-stages
          if-no-files-found: warn
          retention-days: 14
