name: FREE WF02 6 nodes compile actual 141-line DDDS
on:
  push:
    branches: [feature/wf02-free-pyne-ddds-converter-20261104]
    paths:
      - 'n8n/editor-adapter/investment_free_pyne.py'
      - 'n8n/editor-adapter/investment_wf02.py'
      - 'n8n/tests/test_wf02_free_pyne_compiler.py'
      - 'n8n/admin-console/index.html'
      - 'n8n/Dockerfile.native-editor-gateway'
      - '.github/workflows/wf02-free-pyne-ddds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-free-ddds:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual offline open-source PYNE compiler and existing dependencies
        run: |
          python -m pip install 'hoox-pyne[compile]==0.6.31' 'beautifulsoup4==4.13.4' 'psycopg[binary]>=3.2,<4'
      - name: Actual full 141-line DDDS Pine through existing WF02 N01 to N06
        run: python -m unittest discover -s n8n/tests -p 'test_wf02_free_pyne_compiler.py' -v
      - name: Python and frontend syntax
        run: |
          python -m py_compile n8n/editor-adapter/investment_free_pyne.py n8n/editor-adapter/investment_wf02.py n8n/editor-adapter/investment_studio_server.py
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('n8n/admin-console/index.html').read_text()
          js=re.search(r'<script[^>]*>(.*?)</script>',src,re.S)
          assert js is not None
          Path('/tmp/wf02-pyne-ui.js').write_text(js.group(1))
          PY
          node --check /tmp/wf02-pyne-ui.js
