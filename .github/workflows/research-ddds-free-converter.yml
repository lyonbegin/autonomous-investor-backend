name: RESEARCH - FREE offline Pine v6 converter against exact DDDS
on:
  push:
    branches: [research/ddds-free-pine-converters-20261104]
    paths:
      - '.github/workflows/research-ddds-free-converter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hoox-pyne-actual-ddds:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual open-source offline Python Pine compiler
        run: python -m pip install 'hoox-pyne==0.6.32'
      - name: Run source-specific DDDS 141-line parse, compile-to-Python and synthetic smoke diagnostics
        run: |
          python - <<'PY'
          import ast,base64,gzip,hashlib,json,os,subprocess,pathlib
          output=pathlib.Path('/tmp/free-ddds-evidence');output.mkdir(parents=True,exist_ok=True)
          fixture=pathlib.Path('n8n/editor-adapter/fixtures/ddds_published_source.gz.b64')
          pine=gzip.decompress(base64.b64decode(fixture.read_text().strip()))
          sha=hashlib.sha256(pine).hexdigest()
          assert sha=='5a245e99447f13012dd026528235fc2c299cad5cb7b228653c684886dcba6507'
          source=output/'DDDS_exact_141.pine';source.write_bytes(pine)
          manifest={'pine_source_sha256':sha,'source_lines':len(pine.decode().splitlines()),
                    'source_license':'MPL-2.0','converter':'hoox-pyne==0.6.32',
                    'license':'AGPL-3.0','paid_api_used':False,
                    'tradingview_parity_verified':False,
                    'actual_tv_market_data_used':False,'synthetic_smoke_is_parity':False,
                    'steps':{}}
          jobs=[
            ('check',['pyne','check',str(source)]),
            ('compile_emit',['pyne','compile',str(source),'--emit','-o',str(output/'DDDS_generated_hoox.py')]),
            ('run_synthetic_smoke',['pyne','run',str(source),'--bars','200'])
          ]
          for key,cmd in jobs:
            try:
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=140)
              state={'return_code':p.returncode,'stdout_tail':p.stdout[-4500:],'stderr_tail':p.stderr[-4500:]}
              if key=='compile_emit':
                f=output/'DDDS_generated_hoox.py'
                state['python_generated']=f.is_file() and f.stat().st_size>0
                if state['python_generated']:
                  raw=f.read_bytes();state['python_sha256']=hashlib.sha256(raw).hexdigest()
                  state['python_bytes']=len(raw)
                  try:
                    ast.parse(raw.decode('utf8'));state['python_syntax_valid']=True
                  except Exception as e:
                    state['python_syntax_valid']=False;state['syntax_error']=str(e)[:400]
              manifest['steps'][key]=state
            except Exception as e:
              manifest['steps'][key]={'exception':str(e)[:400]}
          (output/'manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False))
          print('ACTUAL_DDDS_FREE_PINE_COMPILER_RESEARCH',json.dumps(manifest,ensure_ascii=False)[:13500])
          PY
      - name: Archive exact source / generated Python if present / detailed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-ddds-free-hoox-python-compile-audit
          path: /tmp/free-ddds-evidence/
          if-no-files-found: warn
          retention-days: 14
