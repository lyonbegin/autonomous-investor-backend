name: WF02 PyneCore real worker + live parity browser check
on:
  push:
    branches: [feature/wf02-pynecore-rights-gate-20261103]
    paths:
      - 'n8n/editor-adapter/investment_wf02.py'
      - 'n8n/tests/test_wf02_rights_gate_20261103.py'
      - 'n8n/tests/test_pynecore_bridge.py'
      - 'n8n/tests/generate_pynecore_demo.py'
      - 'n8n/tests/test_live_pynecore_parity.cjs'
      - 'n8n/pine-parity/pynecore_bridge.py'
      - 'n8n/pine-parity/pynecore_worker.py'
      - '.github/workflows/wf02-rights-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-worker-and-live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check, no fake engine substitution
        run: |
          python -m py_compile n8n/editor-adapter/investment_wf02.py n8n/pine-parity/pynecore_bridge.py n8n/pine-parity/pynecore_worker.py n8n/tests/generate_pynecore_demo.py
      - name: SQLite WF02 rights regression
        run: python -m unittest discover -s n8n/tests -p 'test_wf02_rights_gate_20261103.py' -v
      - name: Install pinned real PyneCore runtime
        run: python -m pip install 'pynesys-pynecore==6.11.1'
      - name: Real PyneCore output, exact-bar mismatch and immutable worker
        run: python -m unittest discover -s n8n/tests -p 'test_pynecore_bridge.py' -v
      - name: Generate downloadable synthetic CSV test package from real worker
        env:
          INVESTMENT_DEMO_OUTPUT: /tmp/investment-pynecore-ci-evidence
        run: python n8n/tests/generate_pynecore_demo.py
      - name: Install actual headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Upload generated CSVs to live Railway parity page in Chromium
        env:
          INVESTMENT_DEMO_OUTPUT: /tmp/investment-pynecore-ci-evidence
          PARITY_TEST_BASE: https://investment-pine-parity-review-production.up.railway.app
        run: node n8n/tests/test_live_pynecore_parity.cjs
      - name: Archive reusable CSVs, execution JSON and actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wf02-pynecore-live-browser-manual-test-package
          path: /tmp/investment-pynecore-ci-evidence/
          if-no-files-found: warn
          retention-days: 14
