name: Integration Lab Portfolio Stack

on:
  push:
    branches: [integration-lab]
    paths:
      - ".github/workflows/integration-lab.yml"

jobs:
  cumulative-portfolio-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "lab/pip-cache-key.txt"

      - name: Checkout exact upstream sources
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/TauricResearch/TradingAgents.git ta
          git -C ta checkout e8f5503e9b86d5c2710b0c76b1f686703968c9df
          git clone --filter=blob:none https://github.com/AI4Finance-Foundation/FinRobot.git fr
          git -C fr checkout 2717499b8e30f242640af08c4ad9afd1113c2d45
          git clone --filter=blob:none https://github.com/microsoft/RD-Agent.git rd
          git -C rd checkout 484776c211e4fbbeef03e0ec00d6bbee7362a4f4
          git clone --filter=blob:none https://github.com/microsoft/qlib.git qlib-src
          git -C qlib-src checkout 54355232463878d2eebb91fe0ee5fa7fa1f5976c
          git clone --filter=blob:none https://github.com/amazon-science/chronos-forecasting.git chronos-src
          git -C chronos-src checkout 1224fafa91e1ecd6674f5204066b159e40b5e4a1
          git clone --filter=blob:none https://github.com/DLR-RM/stable-baselines3.git sb3-src
          git -C sb3-src checkout b2878f4b83e21f16a53c54a62def628e05fd2e96
          git clone --depth 1 --branch ray-2.59.0 --filter=blob:none --sparse https://github.com/ray-project/ray.git ray-src
          git -C ray-src sparse-checkout set rllib python
          git clone --depth 1 --branch v1.2.0 --filter=blob:none https://github.com/polakowo/vectorbt.git vectorbt-src

          git clone --filter=blob:none https://github.com/AI4Finance-Foundation/FinRL-Trading.git finrl-src
          git -C finrl-src checkout 4409abe925c904e570be78ebfb5e77ac3491dff8
          git clone --filter=blob:none https://github.com/dcajasn/Riskfolio-Lib.git riskfolio-src
          git -C riskfolio-src checkout 7b1b26ac9760974c12ecefe290a9d3bd37b66b7a
          git clone --filter=blob:none https://github.com/PyPortfolio/PyPortfolioOpt.git pypfopt-src
          git -C pypfopt-src checkout a6638d2e06dae6f444fd022cfd4b3c528902a85b

      - name: Apply compatibility overlays
        run: |
          set -euxo pipefail
          cp rd/requirements.txt rd/requirements.upstream.txt
          python - <<'PY'
          from pathlib import Path
          p=Path("rd/requirements.txt")
          s=p.read_text()
          s=s.replace(
              "pydantic-ai-slim[mcp,openai,prefect]==1.66.0",
              "pydantic-ai-slim[mcp,openai,prefect]==1.70.0",
          )
          p.write_text(s)

          p=Path("finrl-src/requirements.txt")
          original=p.read_text()
          assert "finnhub>=2.4.19" in original
          p.write_text(original.replace("finnhub>=2.4.19", "finnhub-python>=2.4.19"))
          PY
          diff -u rd/requirements.upstream.txt rd/requirements.txt > rdagent-dependency-compat.patch || true
          git -C finrl-src diff -- requirements.txt > finrl-dependency-compat.patch || true

      - name: Shared constraints
        run: |
          cat > constraints.txt <<'EOF'
          pydantic-ai==1.70.0
          pydantic-ai-slim==1.70.0
          pandas==3.0.6
          numpy>=2.4.6,<3
          mlflow<3.13
          filelock>=3.16,<3.30
          packaging>=25,<26
          torch>=2.8,<3
          gymnasium==1.2.2
          ray==2.59.0
          EOF

      - name: Create shared Python 3.13 environment
        run: |
          python -m venv env
          source env/bin/activate
          python -m pip install -U pip setuptools wheel cython

      - name: Install validated first eight
        run: |
          set -euxo pipefail
          source env/bin/activate
          python -m pip install -c constraints.txt ./ta ./fr/finrobot_desktop ./rd ./qlib-src ./chronos-src ./sb3-src
          python -m pip install -c constraints.txt "ray[rllib]==2.59.0"
          python -m pip install -c constraints.txt ./vectorbt-src
          python -m pip check

      - name: Add FinRL-Trading as ninth engine
        run: |
          set -euxo pipefail
          source env/bin/activate
          python -m pip install -c constraints.txt ./finrl-src
          python -m pip check
          python - <<'PY'
          import pandas as pd
          from strategies.base_strategy import StrategyConfig, EqualWeightStrategy, StrategyResult
          data={"fundamentals": pd.DataFrame({"gvkey":["A","B","C"]})}
          out=EqualWeightStrategy(StrategyConfig(name="eq")).generate_weights(data)
          assert isinstance(out, StrategyResult)
          print("NINE_OK", out.strategy_name, out.weights["weight"].tolist())
          PY

      - name: Add Riskfolio-Lib as tenth engine
        run: |
          set -euxo pipefail
          source env/bin/activate
          python -m pip install -c constraints.txt ./riskfolio-src
          python -m pip check
          python - <<'PY'
          import pandas as pd
          import riskfolio as rp
          returns=pd.DataFrame({
              "A":[0.01,-0.01,0.02,0.00,0.01],
              "B":[0.00,0.01,-0.01,0.02,0.01],
              "C":[0.02,0.00,0.01,-0.01,0.00],
          })
          p=rp.Portfolio(returns=returns)
          p.assets_stats(method_mu="hist", method_cov="hist")
          w=p.optimization(model="Classic", rm="MV", obj="MinRisk", hist=True)
          print("TEN_OK", rp.__version__, w.to_dict())
          PY

      - name: Add PyPortfolioOpt as eleventh engine
        run: |
          set -euxo pipefail
          source env/bin/activate
          python -m pip install -c constraints.txt ./pypfopt-src
          python -m pip check
          python - <<'PY'
          import numpy as np
          import pandas as pd
          import pypfopt
          from pypfopt import EfficientFrontier
          mu=pd.Series([0.10,0.12,0.08], index=["A","B","C"])
          cov=pd.DataFrame(np.diag([0.04,0.05,0.03]), index=mu.index, columns=mu.index)
          ef=EfficientFrontier(mu,cov)
          ef.min_volatility()
          print("ELEVEN_OK", pypfopt.__version__, ef.clean_weights())
          PY

      - name: Verify all eleven native surfaces
        run: |
          set -euxo pipefail
          source env/bin/activate
          python - <<'PY'
          import tradingagents, finrobot, rdagent, qlib, chronos, stable_baselines3, ray, vectorbt, riskfolio, pypfopt
          from tradingagents.graph.trading_graph import TradingAgentsGraph
          from finrobot import FinRobot
          from rdagent.app.qlib_rd_loop.quant import QuantRDLoop
          from qlib.model.base import BaseModel
          from chronos import Chronos2Pipeline
          from stable_baselines3 import PPO
          from ray.rllib.algorithms.ppo import PPOConfig
          from vectorbt.portfolio.base import Portfolio
          from strategies.base_strategy import StrategyResult
          from riskfolio import Portfolio as RiskfolioPortfolio
          from pypfopt import EfficientFrontier
          print("ALL_ELEVEN_IMPORTS_OK")
          print(TradingAgentsGraph, FinRobot, QuantRDLoop, BaseModel, Chronos2Pipeline, PPO, PPOConfig, Portfolio, StrategyResult, RiskfolioPortfolio, EfficientFrontier)
          PY

      - name: Freeze successful eleven-engine environment
        run: |
          source env/bin/activate
          python -m pip freeze | sort > resolved-eleven.txt
          python -m pip check > pip-check-eleven.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-eleven-portfolio-stack-evidence
          path: |
            constraints.txt
            rdagent-dependency-compat.patch
            finrl-dependency-compat.patch
            resolved-eleven.txt
            pip-check-eleven.txt
          retention-days: 3
