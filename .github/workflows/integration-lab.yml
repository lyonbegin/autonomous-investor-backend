name: Integration Lab Cumulative

on:
  push:
    branches: [integration-lab]
    paths:
      - ".github/workflows/integration-lab.yml"

jobs:
  cumulative-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Checkout exact upstream commits
        run: |
          set -euxo pipefail
          git clone https://github.com/TauricResearch/TradingAgents.git ta
          git -C ta checkout e8f5503e9b86d5c2710b0c76b1f686703968c9df
          git clone https://github.com/AI4Finance-Foundation/FinRobot.git fr
          git -C fr checkout 2717499b8e30f242640af08c4ad9afd1113c2d45
          git clone https://github.com/microsoft/RD-Agent.git rd
          git -C rd checkout 484776c211e4fbbeef03e0ec00d6bbee7362a4f4

      - name: Create one shared Python environment
        run: |
          python -m venv env
          source env/bin/activate
          python -m pip install -U pip setuptools wheel

      - name: Install TradingAgents
        run: |
          source env/bin/activate
          python -m pip install ./ta
          python -m pip check
          python - <<'PY'
          import tradingagents
          from tradingagents.graph.trading_graph import TradingAgentsGraph
          print("TradingAgents", tradingagents.__version__, TradingAgentsGraph)
          PY

      - name: Add FinRobot V2 to same environment
        run: |
          source env/bin/activate
          python -m pip install ./fr/finrobot_desktop
          python -m pip check
          python - <<'PY'
          import tradingagents, finrobot
          print("TradingAgents", tradingagents.__version__)
          print("FinRobot", getattr(finrobot, "__version__", None))
          PY
          python -m pip show pydantic-ai pydantic-ai-slim pydantic > after-finrobot.txt
          cat after-finrobot.txt

      - name: Resolve all three together
        id: resolve3
        continue-on-error: true
        run: |
          set -o pipefail
          source env/bin/activate
          python -m pip install --dry-run ./ta ./fr/finrobot_desktop ./rd 2>&1 | tee resolve-three.log

      - name: Add RD-Agent to same environment
        id: installrd
        continue-on-error: true
        run: |
          set -o pipefail
          source env/bin/activate
          python -m pip install ./rd 2>&1 | tee install-rdagent.log

      - name: Check cumulative environment
        if: always()
        run: |
          source env/bin/activate
          echo "=== pip check ==="
          python -m pip check || true
          echo "=== critical versions ==="
          python -m pip show tradingagents finrobot rdagent pydantic-ai pydantic-ai-slim pydantic pydantic-settings 2>/dev/null || true
          echo "=== imports ==="
          python - <<'PY'
          mods=["tradingagents","finrobot","rdagent"]
          for m in mods:
              try:
                  mod=__import__(m)
                  print(m, "IMPORT_OK", getattr(mod,"__version__",None), getattr(mod,"__file__",None))
              except Exception as e:
                  print(m, "IMPORT_FAIL", type(e).__name__, str(e))
          PY
          echo "resolve3_outcome=${{ steps.resolve3.outcome }}"
          echo "installrd_outcome=${{ steps.installrd.outcome }}"

      - name: Upload resolver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-ta-finrobot-rdagent-evidence
          path: |
            resolve-three.log
            install-rdagent.log
            after-finrobot.txt
          retention-days: 3
