name: Integration Lab Compatibility

on:
  push:
    branches: [integration-lab]
    paths:
      - ".github/workflows/integration-lab.yml"

jobs:
  compat-three:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Checkout exact upstream commits
        run: |
          set -euxo pipefail
          git clone https://github.com/TauricResearch/TradingAgents.git ta
          git -C ta checkout e8f5503e9b86d5c2710b0c76b1f686703968c9df
          git clone https://github.com/AI4Finance-Foundation/FinRobot.git fr
          git -C fr checkout 2717499b8e30f242640af08c4ad9afd1113c2d45
          git clone https://github.com/microsoft/RD-Agent.git rd
          git -C rd checkout 484776c211e4fbbeef03e0ec00d6bbee7362a4f4

      - name: Apply dependency-only RD-Agent compatibility metadata
        run: |
          set -euxo pipefail
          cp rd/requirements.txt rd/requirements.upstream.txt
          python - <<'PY'
          from pathlib import Path
          p=Path("rd/requirements.txt")
          s=p.read_text()
          old="pydantic-ai-slim[mcp,openai,prefect]==1.66.0"
          new="pydantic-ai-slim[mcp,openai,prefect]==1.70.0"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          diff -u rd/requirements.upstream.txt rd/requirements.txt | tee rdagent-dependency-compat.patch || true

      - name: Write common constraints
        run: |
          cat > constraints.txt <<'EOF'
          pydantic-ai==1.70.0
          pydantic-ai-slim==1.70.0
          pandas>=3.0.6,<4
          EOF
          cat constraints.txt

      - name: Install all three together into one Python 3.13 venv
        run: |
          set -euxo pipefail
          python -m venv env
          source env/bin/activate
          python -m pip install -U pip setuptools wheel
          python -m pip install -c constraints.txt ./ta ./fr/finrobot_desktop ./rd
          python -m pip check
          python -m pip freeze > resolved-three.txt

      - name: Verify original execution surfaces
        run: |
          set -euxo pipefail
          source env/bin/activate
          python - <<'PY'
          import pandas
          import pydantic_ai
          import tradingagents
          import finrobot
          import rdagent
          from tradingagents.graph.trading_graph import TradingAgentsGraph
          from finrobot import FinRobot
          from rdagent.app.qlib_rd_loop.quant import QuantRDLoop
          from rdagent.components.agent.base import PAIAgent
          from pydantic_ai import Agent
          from pydantic_ai.mcp import MCPServerStreamableHTTP
          from pydantic_ai.models.openai import OpenAIChatModel, OpenAIChatModelSettings
          from pydantic_ai.providers.litellm import LiteLLMProvider
          print("pandas", pandas.__version__)
          print("pydantic_ai", getattr(pydantic_ai,"__version__",None))
          print("TradingAgentsGraph", TradingAgentsGraph)
          print("FinRobot", FinRobot)
          print("QuantRDLoop", QuantRDLoop)
          print("PAIAgent", PAIAgent)
          print("Pydantic surfaces", Agent, MCPServerStreamableHTTP, OpenAIChatModel, OpenAIChatModelSettings, LiteLLMProvider)
          PY

      - name: FinRobot offline TestModel smoke
        run: |
          set -euxo pipefail
          source env/bin/activate
          python - <<'PY'
          from pydantic_ai import Agent
          from pydantic_ai.models.test import TestModel
          a=Agent(TestModel(custom_output_text="ok"))
          r=a.run_sync("test")
          print("FinRobot-compatible Agent smoke:", r.output)
          PY

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-three-evidence
          path: |
            constraints.txt
            rdagent-dependency-compat.patch
            resolved-three.txt
          retention-days: 3
