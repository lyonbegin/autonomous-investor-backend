name: Integration Lab Qlib

on:
  push:
    branches: [integration-lab]
    paths:
      - ".github/workflows/integration-lab.yml"

jobs:
  cumulative-qlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Checkout exact upstream commits
        run: |
          set -euxo pipefail
          git clone https://github.com/TauricResearch/TradingAgents.git ta
          git -C ta checkout e8f5503e9b86d5c2710b0c76b1f686703968c9df
          git clone https://github.com/AI4Finance-Foundation/FinRobot.git fr
          git -C fr checkout 2717499b8e30f242640af08c4ad9afd1113c2d45
          git clone https://github.com/microsoft/RD-Agent.git rd
          git -C rd checkout 484776c211e4fbbeef03e0ec00d6bbee7362a4f4
          git clone https://github.com/microsoft/qlib.git qlib-src
          git -C qlib-src checkout 54355232463878d2eebb91fe0ee5fa7fa1f5976c

      - name: Apply RD-Agent dependency metadata compatibility
        run: |
          cp rd/requirements.txt rd/requirements.upstream.txt
          python - <<'PY'
          from pathlib import Path
          p=Path("rd/requirements.txt")
          s=p.read_text()
          old="pydantic-ai-slim[mcp,openai,prefect]==1.66.0"
          new="pydantic-ai-slim[mcp,openai,prefect]==1.70.0"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          diff -u rd/requirements.upstream.txt rd/requirements.txt > rdagent-dependency-compat.patch || true

      - name: Common constraints after Qlib analysis
        run: |
          cat > constraints.txt <<'EOF'
          pydantic-ai==1.70.0
          pydantic-ai-slim==1.70.0
          pandas>=3.0.6,<4
          mlflow<3.13
          filelock>=3.16.0,<3.30
          EOF
          cat constraints.txt

      - name: Install first four engines together
        run: |
          set -euxo pipefail
          python -m venv env
          source env/bin/activate
          python -m pip install -U pip setuptools wheel cython "numpy>=1.24"
          python -m pip install -c constraints.txt ./ta ./fr/finrobot_desktop ./rd ./qlib-src
          python -m pip check
          python -m pip freeze > resolved-four.txt

      - name: Verify Qlib and prior execution surfaces
        run: |
          set -euxo pipefail
          source env/bin/activate
          python - <<'PY'
          import pandas, qlib, tradingagents, finrobot, rdagent
          from tradingagents.graph.trading_graph import TradingAgentsGraph
          from finrobot import FinRobot
          from rdagent.app.qlib_rd_loop.quant import QuantRDLoop
          from qlib.model.base import BaseModel
          from qlib.strategy.base import BaseStrategy
          from qlib.backtest.decision import BaseTradeDecision
          from qlib.backtest.executor import BaseExecutor
          from qlib.backtest import backtest
          print("pandas", pandas.__version__)
          print("qlib", getattr(qlib, "__version__", None))
          print("TradingAgentsGraph", TradingAgentsGraph)
          print("FinRobot", FinRobot)
          print("QuantRDLoop", QuantRDLoop)
          print("Qlib surfaces", BaseModel, BaseStrategy, BaseTradeDecision, BaseExecutor, backtest)
          PY

      - name: Upload Qlib cumulative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-four-qlib-evidence
          path: |
            constraints.txt
            rdagent-dependency-compat.patch
            resolved-four.txt
          retention-days: 3
