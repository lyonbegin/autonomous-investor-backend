name: Integration Lab Wheelhouse

on:
  push:
    branches: [integration-lab]
    paths:
      - ".github/workflows/integration-lab.yml"
      - "lab/**"

jobs:
  rdagent-wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare RD-Agent source
        run: |
          set -euxo pipefail
          mkdir -p artifacts/wheelhouse
          git clone https://github.com/microsoft/RD-Agent.git upstream-RD-Agent
          cd upstream-RD-Agent
          git checkout 484776c211e4fbbeef03e0ec00d6bbee7362a4f4
          cd ..
          tar -czf artifacts/RD-Agent-484776c2.tar.gz upstream-RD-Agent

      - name: Resolve and build RD-Agent wheelhouse
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel --wheel-dir artifacts/wheelhouse ./upstream-RD-Agent
          python -m pip install --dry-run --report artifacts/rdagent-pip-report.json ./upstream-RD-Agent

      - name: Verify RD-Agent base install on clean Python 3.13
        run: |
          set -euxo pipefail
          python -m venv verify-venv
          source verify-venv/bin/activate
          python -m pip install --no-index --find-links artifacts/wheelhouse rdagent
          python -m pip check
          python - <<'PY'
          import rdagent
          print("rdagent_module=", rdagent.__file__)
          PY

      - name: Upload source and wheelhouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdagent-python313-wheelhouse
          path: artifacts/
          retention-days: 3
