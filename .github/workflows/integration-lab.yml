name: Integration Lab SB3

on:
  push:
    branches: [integration-lab]
    paths:
      - ".github/workflows/integration-lab.yml"

jobs:
  cumulative-sb3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Checkout exact upstream commits
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/TauricResearch/TradingAgents.git ta
          git -C ta checkout e8f5503e9b86d5c2710b0c76b1f686703968c9df
          git clone --filter=blob:none https://github.com/AI4Finance-Foundation/FinRobot.git fr
          git -C fr checkout 2717499b8e30f242640af08c4ad9afd1113c2d45
          git clone --filter=blob:none https://github.com/microsoft/RD-Agent.git rd
          git -C rd checkout 484776c211e4fbbeef03e0ec00d6bbee7362a4f4
          git clone --filter=blob:none https://github.com/microsoft/qlib.git qlib-src
          git -C qlib-src checkout 54355232463878d2eebb91fe0ee5fa7fa1f5976c
          git clone --filter=blob:none https://github.com/amazon-science/chronos-forecasting.git chronos-src
          git -C chronos-src checkout 1224fafa91e1ecd6674f5204066b159e40b5e4a1
          git clone --filter=blob:none https://github.com/DLR-RM/stable-baselines3.git sb3-src
          git -C sb3-src checkout b2878f4b83e21f16a53c54a62def628e05fd2e96

      - name: Apply RD-Agent dependency metadata overlay
        run: |
          cp rd/requirements.txt rd/requirements.upstream.txt
          python - <<'PY'
          from pathlib import Path
          p=Path("rd/requirements.txt")
          s=p.read_text()
          old="pydantic-ai-slim[mcp,openai,prefect]==1.66.0"
          new="pydantic-ai-slim[mcp,openai,prefect]==1.70.0"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          diff -u rd/requirements.upstream.txt rd/requirements.txt > rdagent-dependency-compat.patch || true

      - name: Shared constraints
        run: |
          cat > constraints.txt <<'EOF'
          pydantic-ai==1.70.0
          pydantic-ai-slim==1.70.0
          pandas==3.0.6
          mlflow<3.13
          filelock>=3.16,<3.30
          packaging>=25,<26
          torch>=2.8,<3
          gymnasium==1.2.2
          EOF
          cat constraints.txt

      - name: Create shared Python 3.13 environment
        run: |
          python -m venv env
          source env/bin/activate
          python -m pip install -U pip setuptools wheel cython

      - name: Install verified five engines
        run: |
          set -euxo pipefail
          source env/bin/activate
          python -m pip install -c constraints.txt ./ta ./fr/finrobot_desktop ./rd ./qlib-src ./chronos-src
          python -m pip check

      - name: Add Stable-Baselines3 to the same environment
        run: |
          set -euxo pipefail
          source env/bin/activate
          python -m pip install -c constraints.txt ./sb3-src
          python -m pip check

      - name: Verify SB3 native API and tiny PPO lifecycle
        run: |
          set -euxo pipefail
          source env/bin/activate
          python - <<'PY'
          import gymnasium as gym
          import stable_baselines3 as sb3
          import torch, pandas, chronos, qlib
          from stable_baselines3.common.base_class import BaseAlgorithm
          from stable_baselines3.common.vec_env import VecEnv
          from stable_baselines3 import PPO, SAC
          from tradingagents.graph.trading_graph import TradingAgentsGraph
          from finrobot import FinRobot
          from rdagent.app.qlib_rd_loop.quant import QuantRDLoop

          env = gym.make("CartPole-v1")
          model = PPO("MlpPolicy", env, n_steps=8, batch_size=8, n_epochs=1, device="cpu", verbose=0)
          model.learn(total_timesteps=16)
          obs, info = env.reset(seed=7)
          action, _ = model.predict(obs, deterministic=True)
          print("SIX_OK")
          print("sb3", sb3.__version__)
          print("gymnasium", gym.__version__)
          print("torch", torch.__version__)
          print("ppo_action", action)
          print("native", BaseAlgorithm, VecEnv, PPO, SAC)
          print("prior", TradingAgentsGraph, FinRobot, QuantRDLoop, chronos.Chronos2Pipeline, qlib.__version__)
          env.close()
          PY

      - name: Freeze successful six-engine environment
        run: |
          source env/bin/activate
          python -m pip freeze | sort > resolved-six.txt
          python -m pip check > pip-check-six.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-six-sb3-evidence
          path: |
            constraints.txt
            rdagent-dependency-compat.patch
            resolved-six.txt
            pip-check-six.txt
          retention-days: 3
