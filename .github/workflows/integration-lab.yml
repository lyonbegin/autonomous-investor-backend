name: Integration Lab RLlib

on:
  push:
    branches: [integration-lab]
    paths:
      - ".github/workflows/integration-lab.yml"

jobs:
  cumulative-rllib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "lab/pip-cache-key.txt"

      - name: Checkout exact upstream sources
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/TauricResearch/TradingAgents.git ta
          git -C ta checkout e8f5503e9b86d5c2710b0c76b1f686703968c9df
          git clone --filter=blob:none https://github.com/AI4Finance-Foundation/FinRobot.git fr
          git -C fr checkout 2717499b8e30f242640af08c4ad9afd1113c2d45
          git clone --filter=blob:none https://github.com/microsoft/RD-Agent.git rd
          git -C rd checkout 484776c211e4fbbeef03e0ec00d6bbee7362a4f4
          git clone --filter=blob:none https://github.com/microsoft/qlib.git qlib-src
          git -C qlib-src checkout 54355232463878d2eebb91fe0ee5fa7fa1f5976c
          git clone --filter=blob:none https://github.com/amazon-science/chronos-forecasting.git chronos-src
          git -C chronos-src checkout 1224fafa91e1ecd6674f5204066b159e40b5e4a1
          git clone --filter=blob:none https://github.com/DLR-RM/stable-baselines3.git sb3-src
          git -C sb3-src checkout b2878f4b83e21f16a53c54a62def628e05fd2e96

          # Keep the exact RLlib source corresponding to the installed Ray wheel.
          git clone --depth 1 --branch ray-2.59.0 --filter=blob:none --sparse https://github.com/ray-project/ray.git ray-src
          git -C ray-src sparse-checkout set rllib python

      - name: Apply RD-Agent dependency metadata overlay
        run: |
          cp rd/requirements.txt rd/requirements.upstream.txt
          python - <<'PY'
          from pathlib import Path
          p=Path("rd/requirements.txt")
          s=p.read_text()
          old="pydantic-ai-slim[mcp,openai,prefect]==1.66.0"
          new="pydantic-ai-slim[mcp,openai,prefect]==1.70.0"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          diff -u rd/requirements.upstream.txt rd/requirements.txt > rdagent-dependency-compat.patch || true

      - name: Shared constraints
        run: |
          cat > constraints.txt <<'EOF'
          pydantic-ai==1.70.0
          pydantic-ai-slim==1.70.0
          pandas==3.0.6
          mlflow<3.13
          filelock>=3.16,<3.30
          packaging>=25,<26
          torch>=2.8,<3
          gymnasium==1.2.2
          ray==2.59.0
          EOF

      - name: Create shared Python 3.13 environment
        run: |
          python -m venv env
          source env/bin/activate
          python -m pip install -U pip setuptools wheel cython

      - name: Install verified six engines
        run: |
          set -euxo pipefail
          source env/bin/activate
          python -m pip install -c constraints.txt ./ta ./fr/finrobot_desktop ./rd ./qlib-src ./chronos-src ./sb3-src
          python -m pip check

      - name: Add Ray RLlib 2.59.0 to the same environment
        run: |
          set -euxo pipefail
          source env/bin/activate
          python -m pip install -c constraints.txt "ray[rllib]==2.59.0"
          python -m pip check

      - name: Verify RLlib native API and one PPO iteration
        run: |
          set -euxo pipefail
          source env/bin/activate
          python - <<'PY'
          import ray
          import gymnasium as gym
          from ray.rllib.algorithms.algorithm import Algorithm
          from ray.rllib.algorithms.algorithm_config import AlgorithmConfig
          from ray.rllib.algorithms.ppo import PPOConfig
          from ray.rllib.env.env_runner import EnvRunner
          from stable_baselines3 import PPO as SB3PPO
          from chronos import Chronos2Pipeline
          from rdagent.app.qlib_rd_loop.quant import QuantRDLoop
          from finrobot import FinRobot
          from tradingagents.graph.trading_graph import TradingAgentsGraph
          import qlib

          config = (
              PPOConfig()
              .environment("CartPole-v1")
              .env_runners(num_env_runners=0)
              .training(
                  train_batch_size_per_learner=64,
                  minibatch_size=32,
                  num_epochs=1,
              )
          )
          algo = config.build()
          result = algo.train()
          print("SEVEN_OK")
          print("ray", ray.__version__)
          print("gymnasium", gym.__version__)
          print("training_iteration", result.get("training_iteration"))
          print("native", Algorithm, AlgorithmConfig, PPOConfig, EnvRunner)
          print("prior", TradingAgentsGraph, FinRobot, QuantRDLoop, qlib.__version__, Chronos2Pipeline, SB3PPO)
          algo.stop()
          ray.shutdown()
          PY

      - name: Freeze successful seven-engine environment
        run: |
          source env/bin/activate
          python -m pip freeze | sort > resolved-seven.txt
          python -m pip check > pip-check-seven.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-seven-rllib-evidence
          path: |
            constraints.txt
            rdagent-dependency-compat.patch
            resolved-seven.txt
            pip-check-seven.txt
          retention-days: 3
