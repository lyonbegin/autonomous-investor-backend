name: Integration Lab Compatibility

on:
  push:
    branches: [integration-lab]
    paths:
      - ".github/workflows/integration-lab.yml"

jobs:
  compat-three:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Checkout exact upstream commits
        run: |
          set -euxo pipefail
          git clone https://github.com/TauricResearch/TradingAgents.git ta
          git -C ta checkout e8f5503e9b86d5c2710b0c76b1f686703968c9df
          git clone https://github.com/AI4Finance-Foundation/FinRobot.git fr
          git -C fr checkout 2717499b8e30f242640af08c4ad9afd1113c2d45
          git clone https://github.com/microsoft/RD-Agent.git rd
          git -C rd checkout 484776c211e4fbbeef03e0ec00d6bbee7362a4f4

      - name: Create shared environment
        run: |
          python -m venv env
          source env/bin/activate
          python -m pip install -U pip setuptools wheel

      - name: Install common compatibility versions
        run: |
          source env/bin/activate
          python -m pip install "pandas==3.0.6" "pydantic-ai==1.70.0" "pydantic-ai-slim[mcp,openai,prefect]==1.70.0"

      - name: Install TradingAgents and FinRobot V2
        run: |
          source env/bin/activate
          python -m pip install ./ta ./fr/finrobot_desktop
          python -m pip check
          python - <<'PY'
          import tradingagents, finrobot
          import pandas, pydantic_ai
          print("tradingagents", tradingagents.__version__)
          print("finrobot", getattr(finrobot, "__version__", None))
          print("pandas", pandas.__version__)
          print("pydantic_ai", pydantic_ai.__version__)
          PY

      - name: Install RD-Agent dependencies with compatibility override
        run: |
          source env/bin/activate
          grep -v '^pydantic-ai-slim' rd/requirements.txt > rd-requirements-compat.txt
          python -m pip install -r rd-requirements-compat.txt "pandas==3.0.6" "pydantic-ai-slim[mcp,openai,prefect]==1.70.0"
          python -m pip install --no-deps ./rd

      - name: Verify all three and RD-Agent Pydantic-AI surface
        run: |
          source env/bin/activate
          python -m pip check
          python - <<'PY'
          import tradingagents, finrobot, rdagent, pandas, pydantic_ai
          from tradingagents.graph.trading_graph import TradingAgentsGraph
          from pydantic_ai import Agent
          from pydantic_ai.mcp import MCPServerStreamableHTTP
          from pydantic_ai.models.openai import OpenAIChatModel, OpenAIChatModelSettings
          from pydantic_ai.providers.litellm import LiteLLMProvider
          import rdagent.components.agent.base as rd_agent_base
          import rdagent.oai.backend.pydantic_ai as rd_pai
          print("ALL_IMPORTS_OK")
          print("pandas", pandas.__version__)
          print("pydantic_ai", pydantic_ai.__version__)
          print("TradingAgentsGraph", TradingAgentsGraph)
          print("RD_PAIAgent", rd_agent_base.PAIAgent)
          print("RD_get_agent_model", rd_pai.get_agent_model)
          print("MCPServerStreamableHTTP", MCPServerStreamableHTTP)
          PY

      - name: Freeze unified environment
        run: |
          source env/bin/activate
          python -m pip freeze | sort > unified-three-freeze.txt
          python -m pip check > unified-three-pip-check.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: unified-three-compat-evidence
          path: |
            unified-three-freeze.txt
            unified-three-pip-check.txt
            rd-requirements-compat.txt
          retention-days: 3
