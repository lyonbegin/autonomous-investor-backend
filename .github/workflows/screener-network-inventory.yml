name: TradingView Screener Public UI Network Inventory
on:
  push:
    branches:
      - feature/screener-playwright-network-inventory-20261106
    paths:
      - 'n8n/tools/screener_playwright_capture.py'
      - '.github/workflows/screener-network-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture public TradingView screener UI and redacted Fetch/XHR metadata
        run: python n8n/tools/screener_playwright_capture.py
      - name: Upload evidence (no browser cookies, credentials, or account identifiers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-public-ui-network-inventory
          path: tv_capture/
          retention-days: 7
          if-no-files-found: warn
