name: TradingView Android full-app mobile-web isolated lab
on:
  push:
    paths:
      - "tv_mobile_web/**"
      - ".github/workflows/tv-full-mobile-lab.yml"
  pull_request:
    paths:
      - "tv_mobile_web/**"
      - ".github/workflows/tv-full-mobile-lab.yml"
  workflow_dispatch:
jobs:
  mobile-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated server and browser tests
        run: |
          pip install -r tv_mobile_web/requirements.txt
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Source inspection and basic API tests
        run: |
          node --check tv_mobile_web/web/app.js
          node --check tv_mobile_web/web/world_catalog.js
          python -m pytest -q tv_mobile_web/tests/test_server.py tv_mobile_web/tests/test_chart_daily_contract.py tv_mobile_web/tests/test_market_explorer.py tv_mobile_web/tests/test_market_taxonomy.py
      - name: Start standalone mobile app (no cron, no n8n changes)
        run: |
          uvicorn tv_mobile_web.server:app --host 127.0.0.1 --port 8855 \
            > /tmp/tv-mobile-lab-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8855/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/tv-mobile-lab-server.log
          exit 1
      - name: Chromium responsive UI browser scenarios with explicit market fixtures
        run: python tv_mobile_web/tests/browser_e2e.py
      - name: Verify independently deployed Railway preview from outside the container
        run: |
          python - <<'PY'
          import json
          import urllib.request
          base="https://tradingview-full-mobile-web-lab-production.up.railway.app"
          def read(url):
              with urllib.request.urlopen(url,timeout=20) as response:
                  assert response.status==200
                  return response.read()
          health=json.loads(read(base+"/health"))
          catalog=json.loads(read(base+"/api/app/catalog"))
          assert health["cron_enabled"] is False
          assert health["admin_token_required"] is False
          assert catalog["function_candidate_count"]==339
          assert len(catalog["function_groups"])==26
          html=read(base+"/").decode()
          assert "app.js" in html and "feature_registry.js" in html
          assets=read(base+"/assets/feature_registry.js")
          assert len(assets)>4000
          print("EXTERNAL_RAILWAY_PREVIEW_HTTP_VALIDATED",
                "health_ok",health["status"],
                "source_function_count",catalog["function_candidate_count"])
          PY
      - name: Upload generated screenshots, not Android source or price data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-android-full-mobile-lab-screenshots
          path: /tmp/mobile-app-lab-evidence/
          if-no-files-found: warn
