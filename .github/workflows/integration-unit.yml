name: Backend Boundary Unit Tests

on:
  push:
    branches: [integration-lab]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements/integration-base.txt"
      - ".github/workflows/integration-unit.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: |
          python -m pytest -q
