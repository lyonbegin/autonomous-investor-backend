name: STOCK TV | CLEAN WS10 STRICT SERIAL REAL EVIDENCE
# Clean retry: JSONL Unicode line separators handled as data (not record separators).
on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: "Sequential group 1..443; previous result must already be committed"
        type: string
        required: true
        default: "1"
      recover_capacity_no_send:
        description: "Opt-in fresh room ONLY after remote proof old job failed before any ChatGPT send"
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: STOCK-TV-WS10-FRESH-RESET-20261121-R1
  cancel-in-progress: false
jobs:
  one-ten-only:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      REQUEST_BATCH: ${{ inputs.batch_number || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stocktv-web2api-fresh-reset-20261121
          persist-credentials: true
      - name: Load verified official HITEL WebSocket client pinned to tested procureflow main commit
        uses: actions/checkout@v4
        with:
          repository: lyonbegin/procureflow
          ref: 13d854ad60b9fa30406f2974cff73b47617e78d5
          path: hitel-client
          persist-credentials: false
      - name: Set exact one-ten group (source order not arbitrary A or B)
        run: |
          set -euo pipefail
          [[ "$REQUEST_BATCH" =~ ^[0-9]{1,3}$ ]] || exit 1
          GROUP=$((10#$REQUEST_BATCH))
          (( GROUP >= 1 && GROUP <= 443 )) || exit 1
          echo "BATCH_NUMBER=$GROUP" >> "$GITHUB_ENV"
          echo "BATCH_PAD=$(printf '%04d' "$GROUP")" >> "$GITHUB_ENV"
          FIRST=$(( (GROUP-1)*10+1 ))
          LAST=$(( GROUP*10 ))
          (( LAST <= 4428 )) || LAST=4428
          echo "EXACT_ONE_JOB_ORIGINALS_$FIRST-$LAST"
      - name: Verify clean source manifest and native WebSocket regression offline before any request
        run: |
          set -euo pipefail
          python3 -m py_compile research/serial10/ws_ten_runner.py hitel-client/tools/hitel_chat.py
          python3 -m unittest discover -s tests -p test_stock_ws10_clean.py -v
          python3 research/serial10/ws_ten_runner.py --batch "$BATCH_NUMBER" --dry-run
      - name: Install only official protocol dependency
        run: python3 -m pip install -q websockets==13.1
      - name: Delete old failed HTTP-serial checkpoint artifacts ONLY on first batch
        if: env.REQUEST_BATCH == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tv-serial10-state-0001&per_page=100" \
            --jq '.artifacts[].id' | while read -r ID; do
              test -n "$ID" || continue
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID"
              echo "REMOVED_LEGACY_HTTP_CHECKPOINT_ARTIFACT_ID=$ID"
            done
      - name: Restore only same clean WS10 batch checkpoint, never old HTTP run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="stock-ws10-fresh-reset-20261121-$BATCH_PAD"
          PREV_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [[ -n "$PREV_RUN" ]]; then
            mkdir -p "stock-ws10-fresh-20261121-checkpoints/batch_$BATCH_PAD"
            gh run download "$PREV_RUN" --repo "$GITHUB_REPOSITORY" -n "$NAME" \
              -D "stock-ws10-fresh-20261121-checkpoints/batch_$BATCH_PAD"
            echo "RECOVER_SAME_BATCH_CHECKPOINT_RUN=$PREV_RUN"
          else
            echo "FRESH_WS10_CLIENT_STATE_FOR_BATCH=$BATCH_NUMBER"
          fi
      - name: One native WebSocket ChatGPT send for EXACT TEN or resume same immutable job
        id: research
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.recover_capacity_no_send }}" == "true" ]]; then
            args+=(--recover-capacity-no-send)
          fi
          PYTHONUNBUFFERED=1 python3 research/serial10/ws_ten_runner.py \
            --batch "$BATCH_NUMBER" --out stock-ws10-fresh-20261121-checkpoints \
            --client hitel-client/tools/hitel_chat.py "${args[@]}"
      - name: Save exact client room/job IDs and any raw answer even when incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-ws10-fresh-reset-20261121-${{ env.BATCH_PAD }}
          path: stock-ws10-fresh-20261121-checkpoints/batch_${{ env.BATCH_PAD }}/
          retention-days: 90
          if-no-files-found: warn
      - name: Git-commit verified full ten-source AI reply BEFORE any next HITEL request
        id: persist
        if: steps.research.outcome == 'success'
        run: |
          set -euo pipefail
          SRC="stock-ws10-fresh-20261121-checkpoints/batch_$BATCH_PAD"
          test -s "$SRC/result.json"
          test -s "$SRC/summary.json"
          python3 research/serial10/ws_ten_runner.py --batch "$BATCH_NUMBER" \
            --verify-file "$SRC/result.json"
          mkdir -p research/serial10/fresh_runs/reset_20261121_r1/results
          cp "$SRC/result.json" "research/serial10/fresh_runs/reset_20261121_r1/results/batch_$BATCH_PAD.json"
          cp "$SRC/summary.json" "research/serial10/fresh_runs/reset_20261121_r1/results/batch_$BATCH_PAD.summary.json"
          git config user.name "stock-ws10-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "research/serial10/fresh_runs/reset_20261121_r1/results/batch_$BATCH_PAD.json" \
                  "research/serial10/fresh_runs/reset_20261121_r1/results/batch_$BATCH_PAD.summary.json"
          if ! git diff --cached --quiet; then
            git commit -m "Preserve verified HITEL WebSocket trading case results for source group $BATCH_NUMBER"
            git push origin HEAD:feature/stocktv-web2api-fresh-reset-20261121
          fi
          git fetch origin feature/stocktv-web2api-fresh-reset-20261121
          git cat-file -e "FETCH_HEAD:research/serial10/fresh_runs/reset_20261121_r1/results/batch_$BATCH_PAD.json"
          echo "REMOTE_TEN_RESULT_COMMITTED_AND_PRESENT=$BATCH_NUMBER"
      - name: Request next ten ONLY after verified answer has been durably committed
        if: steps.persist.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "### Verified and committed full ten-source result batch $BATCH_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          cat "stock-ws10-fresh-20261121-checkpoints/batch_$BATCH_PAD/summary.json" >> "$GITHUB_STEP_SUMMARY"
          NEXT=$(( BATCH_NUMBER+1 ))
          if (( NEXT <= 443 )); then
            gh workflow run stock-tv-ws10-clean.yml \
              --ref feature/stocktv-web2api-fresh-reset-20261121 \
              -f batch_number="$NEXT"
            echo "NEXT_BATCH_DISPATCHED_ONLY_AFTER_REMOTE_COMMIT=$NEXT"
          else
            echo "ALL_4428_STRATEGIES_RESEARCH_RESPONSES_SAVED"
          fi
      - name: Failure or unverified reply means NO next batch
        if: failure()
        run: |
          echo "SEARCH_INCOMPLETE_NO_NEXT_HITEL_REQUEST" >> "$GITHUB_STEP_SUMMARY"
          if test -f "stock-ws10-fresh-20261121-checkpoints/batch_$BATCH_PAD/client_state.json"; then
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(f"stock-ws10-fresh-20261121-checkpoints/batch_{os.environ['BATCH_PAD']}/client_state.json")
          s=json.loads(p.read_text(encoding="utf-8"))
          print("PRESERVED_CLIENT_JOB_SCOPE", {k:s.get(k) for k in (
            "room_name","room_id","request_id","job_id","status","error_code")})
          PY
          fi
