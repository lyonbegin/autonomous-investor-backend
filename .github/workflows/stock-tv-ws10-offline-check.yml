name: STOCK TV WS10 | offline source and recovery contract tests only
on:
  push:
    branches: [feature/hitel-a-kg-recovery-20261119]
    paths:
      - .github/workflows/stock-tv-ws10-offline-check.yml
permissions:
  contents: read
jobs:
  mock-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Strict offline tests; NO HITEL WebSocket or ChatGPT request
        run: |
          set -euo pipefail
          python3 -m py_compile research/serial10/ws_ten_runner.py tests/test_stock_ws10_clean.py
          python3 -m unittest discover -s tests -p test_stock_ws10_clean.py -v
          python3 research/serial10/ws_ten_runner.py --batch 1 --dry-run
          echo PASS_CLEAN_NATIVE_WS10_OFFLINE_CONTRACT_ONLY
