name: Nautilus Exact Source Fast Build

on:
  push:
    branches: [integration-lab]
    paths:
      - ".github/workflows/integration-nautilus-fast.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Checkout exact source
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/nautechsystems/nautilus_trader.git nautilus-src
          git -C nautilus-src checkout a82b470c1ea214ac1bd1139e2f5ff455d45dbd99
          test "$(git -C nautilus-src rev-parse HEAD)" = "a82b470c1ea214ac1bd1139e2f5ff455d45dbd99"

      - name: Rust 1.99.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.99.0"
          override: true
          cache: false

      - name: Native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y lld patchelf

      - name: Build exact Python 3.13 wheel
        run: |
          set -euxo pipefail
          python -m venv env
          source env/bin/activate
          python -m pip install -U pip "maturin==1.15.0"
          export PYO3_PYTHON="$VIRTUAL_ENV/bin/python"
          export CARGO_BUILD_JOBS=4
          cd nautilus-src/python
          maturin build --locked --release --out ../dist

      - name: Install and verify wheel
        run: |
          set -euxo pipefail
          source env/bin/activate
          python -m pip install --no-deps nautilus-src/dist/*.whl
          python -m pip check
          python - <<'PY'
          import nautilus_trader
          from nautilus_trader.trading import Strategy, StrategyConfig
          from nautilus_trader.backtest import BacktestEngineConfig, BacktestNode
          from nautilus_trader.risk import RiskEngineConfig
          from nautilus_trader.execution import ExecutionEngineConfig
          risk=RiskEngineConfig()
          execution=ExecutionEngineConfig()
          backtest=BacktestEngineConfig(risk_engine=risk, exec_engine=execution)
          print("NAUTILUS_EXACT_SOURCE_FAST_OK", nautilus_trader.__version__)
          print(Strategy, StrategyConfig, BacktestNode, type(backtest), type(risk), type(execution))
          PY
          sha256sum nautilus-src/dist/*.whl > nautilus-wheel-sha256.txt

      - name: Upload exact source wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-exact-source-wheel
          path: |
            nautilus-src/dist/*.whl
            nautilus-wheel-sha256.txt
          retention-days: 3
