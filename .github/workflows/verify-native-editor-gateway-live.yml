name: Verify no browser login and protected n8n administration
on:
  push:
    branches: [feature/public-demo-readonly-20261025]
    paths: ['.github/workflows/verify-native-editor-gateway-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - name: Check production redirect without WWW-Authenticate and blocked n8n admin
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,time
          base='https://investment-n8n-native-editor-production.up.railway.app'
          class NoFollow(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoFollow())
          def check(path,method='GET'):
            req=urllib.request.Request(base+path,method=method)
            try:
              with opener.open(req,timeout=15) as r:return r.status,r.headers
            except urllib.error.HTTPError as e:return e.code,e.headers
          for _ in range(20):
            try:
              status,_=check('/health')
              if status==200:break
            except Exception:pass
            time.sleep(3)
          assert status==200
          code,headers=check('/')
          assert code==302,(code,dict(headers))
          assert headers.get('WWW-Authenticate') is None
          assert headers.get('Location')=='https://investment-n8n-operations-ui-production.up.railway.app/'
          print('LOGIN_PROMPT_REMOVED',code)
          for path in ['/setup','/rest/settings','/rest/workflows','/api/v1/workflows','/workflow/aiOperationF01']:
            status,_=check(path)
            assert status==403,(path,status)
            print('ADMIN_DENIED',status,path)
          code,_=check('/',method='POST')
          assert code==403,code
          print('NATIVE_ADMIN_NOT_EXPOSED')
          PY
