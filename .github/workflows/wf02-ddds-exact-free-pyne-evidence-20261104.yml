name: DDDS 141-line real FREE hoox-pyne conversion evidence
on:
  push:
    branches:
      - feature/wf02-ddds-free-real-run-20261104
    paths:
      - 'n8n/tests/compile_ddds_using_free_pyne.py'
      - 'n8n/tests/test_ddds_free_compile.py'
      - '.github/workflows/wf02-ddds-exact-free-pyne-evidence-20261104.yml'
  pull_request:
    branches:
      - feature/wf02-free-pyne-ddds-converter-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-actual-ddds:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free compiler with no external API key
        run: |
          python -m pip install 'hoox-pyne[compile]==0.6.31' 'beautifulsoup4==4.13.4'
          pyne --version
      - name: Test gate with SYNTHETIC unit cases
        run: python n8n/tests/test_ddds_free_compile.py -v
      - name: Compile exactly pinned DDDS bundled Pine via original WF02 adapter
        env:
          DDDS_COMPILE_OUTPUT_DIR: /tmp/ddds-exact-free-evidence
        run: python n8n/tests/compile_ddds_using_free_pyne.py
      - name: Save generated Python or precise blocker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddds-141-real-hoox-pyne-compile-evidence
          path: /tmp/ddds-exact-free-evidence/
          if-no-files-found: warn
          retention-days: 14
