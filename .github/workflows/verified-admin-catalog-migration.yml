name: Verified Scripts Admin Migration — Exact React UI and Cumulative Proof Gate
on:
  push:
    branches: [feature/admin-verified-strategies-catalog-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install studio metadata dependencies
        run: python -m pip install "beautifulsoup4==4.13.4" "psycopg[binary]>=3.2,<4"
      - name: Python syntax for real server, registry and Postgres verifier
        run: |
          python -m py_compile n8n/editor-adapter/investment_verified_catalog.py n8n/editor-adapter/investment_studio_server.py n8n/investment-db/investment_pg.py
      - name: Persistent catalog security and exact DDDS verifier tests
        run: python n8n/tests/test_verified_strategy_catalog.py -v
      - name: Original admin HTML JS still parses and verified UI registered
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const text=fs.readFileSync('n8n/admin-console/index.html','utf8');
          const scripts=[...text.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          for(const code of scripts)new vm.Script(code);
          assert(text.includes("['verified','검증 완료 전략'"));
          assert(text.includes('/verified/index.html?view=list'));
          assert(text.includes("verified-publish"));
          console.log('ADMIN_VERIFIED_SCRIPTS_EMBED_JS_PASS');
          NODE
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build ACTUAL native editor production Docker with pinned /scripts React
        run: docker build -f n8n/Dockerfile.native-editor-gateway -t verified-stock-editor:test .
      - name: Check both original admin and copied verified static assets exist
        run: |
          docker run --rm --entrypoint sh verified-stock-editor:test -c \
            'test -s /app/dist/admin/index.html && test -s /app/dist/verified/index.html && ls /app/dist/verified/assets/*.js >/dev/null && python3 -m py_compile /app/investment_verified_catalog.py'
