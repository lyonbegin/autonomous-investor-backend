name: STOCK TV post-fix LIVE 9 real-trade searches 3x3
on:
  push:
    branches: [feature/hitel-a-kg-recovery-20261119]
    paths:
      - .github/workflows/stock-tv-nine-hitel-fixed-live-20261120.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: STOCK-TV-FIXED-NINE-LIVE-20261120
  cancel-in-progress: false
jobs:
  three-in-one:
    name: One new ChatGPT research request for original group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [1, 2, 3]
    env:
      STOCK_HITEL_FRESH_EPOCH: "20261120"
      STOCK_HITEL_POLL_TIMEOUT: "5400"
    steps:
      - uses: actions/checkout@v4
      - name: Verify nine exact real TradingView source IDs and generated prompt size
        run: |
          set -euo pipefail
          python3 -m py_compile research/search_only/hitel_three_by_three.py
          python3 - <<'PY'
          from sys import path
          path.insert(0,'research/search_only')
          from hitel_three_by_three import originals,research_prompt
          rows=originals()
          for n in (1,2,3):
              r=rows[3*(n-1):3*n]
              assert len(r)==3
              p=research_prompt(r,n)
              assert len(p)<20000, (n,len(p))
              print('VERIFIED_3X3_BATCH',n,[x['script_id'] for x in r])
          PY
      - name: Resume only same fixed-epoch job if a previous checkpoint exists
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          ARTIFACT="stock-tv-nine-fixed-20261120-group-$GROUP"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -n "$ID" ]; then
            mkdir -p "search-nine-fixed-20261120/batch_$GROUP"
            gh run download "$ID" --repo "$GITHUB_REPOSITORY" -n "$ARTIFACT" \
              -D "search-nine-fixed-20261120/batch_$GROUP"
            echo "FIXED_EPOCH_SAME_JOB_RESTORED_FROM_RUN=$ID"
          else
            echo "NEW_FIXED_EPOCH_REQUEST_BUNDLE=$GROUP"
          fi
      - name: Exactly three TradingView originals in one HITEL ChatGPT request, then read-only polling
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python3 research/search_only/hitel_three_by_three.py \
            --batch "$GROUP" --output search-nine-fixed-20261120
      - name: Preserve each real batch checkpoint even when failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-tv-nine-fixed-20261120-group-${{ matrix.group }}
          path: search-nine-fixed-20261120/batch_${{ matrix.group }}/
          retention-days: 90
          if-no-files-found: warn
      - name: Report actual job ID and observed completion without false success
        if: always()
        env:
          GROUP: ${{ matrix.group }}
        run: |
          echo "## HITEL fixed epoch group $GROUP" >> "$GITHUB_STEP_SUMMARY"
          cat "search-nine-fixed-20261120/batch_$GROUP/state.json" >> "$GITHUB_STEP_SUMMARY" || true

  verify-nine:
    needs: three-in-one
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exactly three independent HITEL replies
        uses: actions/download-artifact@v4
        with:
          pattern: stock-tv-nine-fixed-20261120-group-*
          path: fresh-three
          merge-multiple: false
      - name: Validate nine unique originals and genuine case evidence links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          expected=["02yfhjiz","03zgCMqx","04erUlJM","06s9ohae","06wt9GNj",
                    "06zatx1k","07CF7RMb","07xDq1rh","089fmfw1"]
          all_rows=[]
          for group in (1,2,3):
              path=Path(f"fresh-three/stock-tv-nine-fixed-20261120-group-{group}/result.json")
              if not path.exists():raise RuntimeError(f"NO_HITEL_FINAL_JSON_GROUP_{group}")
              payload=json.loads(path.read_text(encoding="utf-8"))
              if payload.get("batch_no")!=group:raise ValueError(f"WRONG_BATCH_{group}")
              all_rows.extend(payload.get("source_results",[]))
          assert [x.get("script_id") for x in all_rows]==expected
          entries=sum(len(x.get("cases",[])) for x in all_rows)
          with_cases=sum(bool(x.get("cases")) for x in all_rows)
          result={"originals_received":len(all_rows),"logical_HITEL_ChatGPT_requests":3,
            "case_entries_received":entries,"originals_with_documented_cases":with_cases,
            "all_nine_research_responses_received":True,
            "original_ids":expected,
            "independent_source_document_content_verified":False,
            "note":"Proof is response identity and JSON schema, not independently verified trade executions"}
          Path("fresh-nine-summary.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False))
          if with_cases!=9:raise RuntimeError("SOME_ORIGINALS_NO_DOCUMENTED_REAL_TRADE_CASES")
          PY
      - name: Preserve final truthful all-nine summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-tv-nine-fixed-20261120-final-summary
          path: fresh-nine-summary.json
          if-no-files-found: ignore
