name: Genuine isolated PyneCore broker trade events (SMA test only)
on:
  push:
    branches: [feature/wf02-ddds-verified-execution-gate-20261104]
    paths:
      - 'n8n/pine-parity/pynecore_bridge.py'
      - 'n8n/pine-parity/pynecore_worker.py'
      - 'n8n/tests/test_pynecore_actual_closed_trade_events.py'
      - '.github/workflows/wf02-pynecore-trade-events.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pynesys-pynecore==6.11.1'
      - name: Actual PyneCore ScriptRunner broker-generated trades, synthetic bars labeled
        run: |
          python -m unittest discover -s n8n/tests -p 'test_pynecore_actual_closed_trade_events.py' -v
          python -m unittest discover -s n8n/tests -p 'test_pynecore_bridge.py' -v
      - name: Validate worker modules compile and never claim source-strategy parity
        run: python -m py_compile n8n/pine-parity/pynecore_bridge.py n8n/pine-parity/pynecore_worker.py
