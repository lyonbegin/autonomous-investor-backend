name: ACTUAL DDDS 141-line PyneComp compile (never fake parity)
on:
  push:
    branches: [feature/wf02-ddds-verified-execution-gate-20261104]
    paths:
      - 'n8n/tests/compile_ddds_using_real_pynecomp.py'
      - '.github/workflows/wf02-ddds-actual-pynecomp-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-real-ddds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unchanged production PyneCore runtime
        run: python -m pip install 'pynesys-pynecore==6.11.1' 'beautifulsoup4==4.13.4'
      - name: Call existing real PyneComp endpoint only if secret available
        env:
          PYNESYS_API_KEY: ${{ secrets.PYNESYS_API_KEY }}
          WF02_DDDS_COMPILE_EVIDENCE: /tmp/ddds-exact-pynecomp
        run: python n8n/tests/compile_ddds_using_real_pynecomp.py
      - name: Preserve exact Pine hash and official generated Python artifact if conversion ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddss-141-pine-actual-pynecomp-outcome
          path: /tmp/ddds-exact-pynecomp/
          if-no-files-found: warn
          retention-days: 14
