name: Independent synchronized 10-year 1D collection verification
on:
  push:
    paths:
      - 'market_daily_10y/**'
      - '.github/workflows/daily-10y-collector.yml'
  pull_request:
    paths:
      - 'market_daily_10y/**'
      - '.github/workflows/daily-10y-collector.yml'
  workflow_dispatch:
jobs:
  alignment-and-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Parquet and Yahoo dependencies
        run: pip install -r market_daily_10y/requirements.txt
      - name: Verify exact date alignment, 10Y eligibility and incremental saves
        run: python -m pytest -q market_daily_10y/tests/test_collector.py market_daily_10y/tests/test_universe_discovery.py market_daily_10y/tests/test_global_universe.py
      - name: Display empty persistent-store schema (never fake populated data)
        run: python -m market_daily_10y.collector --root /tmp/market_10yr_unit --status
  yahoo-real-ten-year-smoke:
    runs-on: ubuntu-latest
    needs: alignment-and-storage
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: pip install -r market_daily_10y/requirements.txt
      - name: Fetch ACTUAL 10 years of one Yahoo symbol, no old fixture
        run: |
          python -m market_daily_10y.collector --root /tmp/market_10yr_real --limit 1 --pause 0 --asof 2026-11-04 2>&1 | tee /tmp/yahoo-10yr.log
          python -m market_daily_10y.collector --root /tmp/market_10yr_real --status > /tmp/market-10yr-status.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/market-10yr-status.json'))
          assert d['eligible']==1, 'Yahoo live ten-year daily data not confirmed; see fetch log'
          x=d['instruments'][0]
          assert x['start']=='2016-11-04' and x['end_exclusive']=='2026-11-04'
          assert x['rows']>2000 and x['coverage']>=0.8
          print('LIVE_YAHOO_10Y_1D_VERIFIED',x['key'],x['rows'],x['first_date'],x['last_date'])
          PY
      - name: Check actual non-equity ten-year collection (FX and crypto spot)
        run: |
          python -m market_daily_10y.collector --root /tmp/market_10yr_real --asset fx --limit 1 --pause 1 --asof 2026-11-04 2>&1 | tee /tmp/fx-10yr.log
          python -m market_daily_10y.collector --root /tmp/market_10yr_real --asset crypto_spot --limit 1 --pause 1 --asof 2026-11-04 2>&1 | tee /tmp/crypto-10yr.log
          python -m market_daily_10y.collector --root /tmp/market_10yr_real --status > /tmp/multiasset-10yr-status.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/multiasset-10yr-status.json'))
          kinds={x['asset_class'] for x in data['instruments'] if x['eligible']}
          assert {'equity','fx','crypto_spot'}.issubset(kinds), ('NON_EQUITY_TEN_YEAR_YAHOO_DATA_NOT_VERIFIED',kinds)
          print('LIVE_YAHOO_MULTI_ASSET_10Y_VERIFIED', data['stored'], data['eligible'])
          from market_daily_10y.collector import Store,load_universe
          items={x.key:x for x in load_universe('market_daily_10y/universe.csv')}
          store=Store('/tmp/market_10yr_real')
          eq=next(x for x in data['instruments'] if x['eligible'] and x['asset_class']=='equity')
          for asset in ('fx','crypto_spot'):
              candidate=next(x for x in data['instruments'] if x['eligible'] and x['asset_class']==asset)
              joined,quality=store.align(items[eq['key']],items[candidate['key']])
              assert quality['common_dates']>1800 and not quality['filled_gaps']
              assert joined['date'].is_unique
              print('REAL_IDENTICAL_DATE_ALIGNMENT',eq['key'],candidate['key'],
                    quality['common_dates'],quality['start'],quality['end_exclusive'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yahoo-real-ten-year-smoke-evidence
          path: |
            /tmp/yahoo-10yr.log
            /tmp/market-10yr-status.json
            /tmp/fx-10yr.log
            /tmp/crypto-10yr.log
            /tmp/multiasset-10yr-status.json
          if-no-files-found: warn

  hkex-official-listing-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbook reader
        run: pip install -r market_daily_10y/requirements.txt
      - name: Probe official current HKEX securities listing (not prices)
        run: python -m market_daily_10y.official_listing_smoke --allow-network
