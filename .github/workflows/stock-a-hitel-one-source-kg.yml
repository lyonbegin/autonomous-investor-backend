name: STOCK A | HITEL single-source KG -> blind replay -> compare (pilot)
on:
  push:
    branches: [feature/hitel-a-kg-serial-20261119]
    paths:
      - .github/workflows/stock-a-hitel-one-source-kg.yml
      - research/hitel_a_one_source.py
      - research/queue/a_one_source_pilot.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-a-hitel-single-source-pilot
  cancel-in-progress: false
jobs:
  one-a-source:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact one-item A pilot source and Python transport
        run: |
          python3 -m py_compile research/hitel_a_one_source.py
          python3 - <<'PY'
          import json
          p=json.load(open('research/queue/a_one_source_pilot.json',encoding='utf-8'))
          assert p['group']=='A' and p['source_id']=='0LJUxO7T'
          assert not p['official_a_order_verified']
          assert p['pine_source_status']=='NOT_VERIFIED'
          print('A_CONFIRMED_SAMPLE_NOT_OFFICIAL_FIRST',p['source_id'])
          PY
      - name: ChatGPT via HITEL | exactly one A source, all related cases, per-case blind replay and iterative rebuilding
        run: |
          python3 research/hitel_a_one_source.py \
            --input research/queue/a_one_source_pilot.json \
            --out a-hitel-kg-output \
            --max-rounds 2 --poll-seconds 900
      - name: Preserve ALL received responses, graph rounds, blind comparisons and checkpoint even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-a-one-source-hitel-graph-checkpoint
          path: a-hitel-kg-output/
          if-no-files-found: warn
          retention-days: 90
      - name: Report status without claiming final reversibility
        if: always()
        run: |
          if [ -f a-hitel-kg-output/status.json ]; then
            echo '### One A source: actual HITEL run evidence' >> "$GITHUB_STEP_SUMMARY"
            cat a-hitel-kg-output/status.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No HITEL checkpoint created.' >> "$GITHUB_STEP_SUMMARY"
          fi
