name: Live Railway shared studio SQLite sandbox HTTP regression
on:
  push:
    branches: [feature/shared-studio-server-db-20261029, feature/shared-studio-revision-history-20261029]
    paths:
      - "n8n/tests/verify-studio-railway-sandbox.py"
      - ".github/workflows/verify-studio-railway-sandbox.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  railway-sandbox-http:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Check actual deployed shared studio public draft API (no LIVE)
        run: |
          for attempt in $(seq 1 16); do
            if curl --fail --silent --show-error --connect-timeout 8 --max-time 15 https://investment-shared-n8n-studio-production.up.railway.app/api/studio/health; then break; fi
            sleep 10
          done
          python n8n/tests/verify-studio-railway-sandbox.py
          STUDIO_SANDBOX_URL=https://investment-n8n-native-editor-production.up.railway.app/ python n8n/tests/verify-studio-railway-sandbox.py
