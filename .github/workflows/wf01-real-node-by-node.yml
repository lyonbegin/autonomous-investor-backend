name: WF01 real sequential execution (N01 output -> N02 -> N03)
on:
  push:
    branches: [feature/editor-wf01-canvas-20261029]
    paths:
      - 'n8n/editor-adapter/**'
      - 'n8n/workflows/operations/WF01-latest-strategy-one.json'
      - 'n8n/workflows/operations/WF01-latest-library-one.json'
      - 'n8n/Dockerfile.native-editor-gateway'
      - '.github/workflows/wf01-real-node-by-node.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-live-node-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate project-owned N01 N02 N03 Python contracts
        run: |
          python3 -m py_compile n8n/editor-adapter/investment_node_adapter.py n8n/editor-adapter/probe_real_chain.py
          PYTHONPATH=n8n/editor-adapter python3 -m unittest discover -s n8n/editor-adapter -p 'test_*.py' -v
      - name: Wait for actual Railway N03 adapter deployment
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          root="https://investment-n8n-native-editor-production.up.railway.app"
          path=root+"/api/studio/workflows/operations/WF01-latest-strategy-one.json"
          for i in range(60):
              try:
                  raw=json.load(urllib.request.urlopen(path,timeout=8))
                  node=next(n for n in raw["workflow"]["nodes"] if n["id"]=="wf01-strategy-03")
                  binding=node["parameters"]["studioPython"]
                  if binding["python_function"]=="execute_node03" and binding["code_version"]=="wf01-n03-authorized-catalog-v1":
                      print("N03_REALLY_DEPLOYED_IN_RAILWAY");break
              except Exception as exc:
                  print("N03_DEPLOY_WAIT",type(exc).__name__,str(exc)[:120],flush=True)
              time.sleep(4)
          else:raise RuntimeError("ACTUAL_N03_PROJECT_BINDING_NOT_DEPLOYED")
          PY
      - name: Actually execute N01 then pass output to N02 then attempt N03 (strategy)
        run: |
          PYTHONPATH=n8n/editor-adapter WF01_KIND=strategy python3 n8n/editor-adapter/probe_real_chain.py | tee /tmp/wf01-real-strategy.log
      - name: Actually execute N01 then pass output to N02 then attempt N03 (library)
        run: |
          PYTHONPATH=n8n/editor-adapter WF01_KIND=library python3 n8n/editor-adapter/probe_real_chain.py | tee /tmp/wf01-real-library.log
      - name: Archive real service execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-wf01-n01-n02-n03-service-trace
          path: /tmp/wf01-real-*.log
          if-no-files-found: ignore
