name: AI Invest Studio independent Android APK - build and emulator
on:
  push:
    branches: [feature/ai-invest-mts-reassembled-apk-20261116]
    paths:
      - 'android/ai-invest-mts/**'
      - '.github/workflows/ai-invest-mts-apk.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build independently installable signed debug APK
        run: |
          gradle --no-daemon -p android/ai-invest-mts :app:assembleDebug --stacktrace
          test -s android/ai-invest-mts/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p reports/ai-invest-mts-build
          sha256sum android/ai-invest-mts/app/build/outputs/apk/debug/app-debug.apk | tee reports/ai-invest-mts-build/apk-sha256.txt
          unzip -t android/ai-invest-mts/app/build/outputs/apk/debug/app-debug.apk > reports/ai-invest-mts-build/zip-test.txt
          unzip -Z1 android/ai-invest-mts/app/build/outputs/apk/debug/app-debug.apk > reports/ai-invest-mts-build/apk-files.txt
          echo 'AI_INVEST_STUDIO_APK_BUILD_PASS' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ai-invest-studio-android-apk
          path: android/ai-invest-mts/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-invest-studio-build-evidence
          path: reports/ai-invest-mts-build/
          retention-days: 30

  emulator-smoke:
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ai-invest-studio-android-apk
          path: android/ai-invest-mts/app/build/outputs/apk/debug/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install APK and operate six screens on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2
          script: bash android/ai-invest-mts/tools/emulator_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-invest-studio-emulator-test-evidence
          path: reports/ai-invest-mts-emulator/
          retention-days: 30
