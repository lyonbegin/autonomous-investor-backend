name: TradingView Screener Clone - Visual and Interaction Parity
on:
  push:
    branches: [feature/screener-three-xhr-json-20261106]
    paths:
      - "investment_studio/**"
      - "n8n/Caddyfile.railway"
      - ".github/workflows/screener-clone-visual-e2e.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  visual-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: investment_studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typescript/Vite compile
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Vite production-like local server
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/screener-vite.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5177 >/dev/null && break; sleep 2; done
      - name: Run Chromium real data, menu interactions and screenshot comparison
        run: |
          mkdir -p comparison/screens
          npx playwright test tests/screener-clone.spec.ts --reporter=line --workers=1
      - name: Upload all visual evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-clone-visual-e2e
          path: |
            investment_studio/comparison/**
            investment_studio/test-results/**
          retention-days: 14
          if-no-files-found: warn
      - name: Print failing server log
        if: failure()
        run: tail -100 /tmp/screener-vite.log
