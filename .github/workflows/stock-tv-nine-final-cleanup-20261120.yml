name: DELETE cancelled TradingView 3x3 research artifacts and check HITEL status
on:
  push:
    branches:
      - feature/hitel-a-kg-recovery-20261119
    paths:
      - .github/workflows/stock-tv-nine-final-cleanup-20261120.yml
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Delete nine known cancelled-run checkpoints only after exact run ownership check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in \
            "14546131182:44547757109" \
            "14545307360:44547757109" \
            "14544384411:44547757109" \
            "14606925681:44685634659" \
            "14606746310:44685634659" \
            "14606392583:44685634659" \
            "14608473305:44686296522" \
            "14608038863:44686296522" \
            "14607919769:44686296522"
          do
            id="${pair%%:*}"; expected="${pair#*:}"
            info=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" \
              --jq '[.name, (.workflow_run.id|tostring)] | join("|")')
            name="${info%%|*}"; actual="${info#*|}"
            test "$actual" = "$expected" || { echo "SAFETY_RUN_ID_MISMATCH $id"; exit 1; }
            [[ "$name" == stock-tv-nine-* ]] || { echo "SAFETY_ARTIFACT_NAME_MISMATCH $id $name"; exit 1; }
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null
            echo "DELETED_CANCELLED_RUN_ARTIFACT $id $expected $name"
          done
      - name: Check exact old and new HITEL jobs without sending any chat request
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request,json
          root="https://hitel-integration-api-production.up.railway.app"
          jobs=[
          ("new-batch-1","job_86dd881246f94626823feb6b26ba8d07"),
          ("new-batch-2","job_5dbabf2c4e514301bd15240a3f5aa0e4"),
          ("new-batch-3","job_116fa149fa364d4a819203e7ba73c406"),
          ("old-batch-1","job_f6a95e41fef84819b62e138e5e2bd523"),
          ("old-batch-2","job_59d53116ca654e8fbb86ed96e45b610f"),
          ("old-batch-3","job_f725f5c88b6149ebaf0eb5e9b241032d")]
          for label,jid in jobs:
            try:
              with urllib.request.urlopen(root+"/integrations/v1/public/jobs/"+jid,timeout=12) as resp:
                d=json.load(resp)
              print("HITEL_CANCELLED_WORKFLOW_JOB_STATUS",json.dumps({
                "label":label,"job_id":jid,"status":d.get("status"),"stage":d.get("stage"),
                "result_bytes":len(d.get("result_text") or ""),
                "error":str(d.get("error") or "")[:140]}),flush=True)
            except Exception as e: print("HITEL_JOB_GET_FAILED",label,type(e).__name__,str(e)[:100],flush=True)
          try:
            with urllib.request.urlopen(root+"/openapi.json",timeout=10) as resp:
              spec=json.load(resp)
            possible=[(p,list(v)) for p,v in (spec.get("paths") or {}).items()
                if "job" in p.lower() and (any(x in p.lower() for x in ["cancel","stop","abort"]) or "delete" in v)]
            print("HITEL_DOCUMENTED_JOB_CANCELLATION_PATHS",json.dumps(possible))
          except Exception as e: print("HITEL_CANCELLATION_API_NOT_CONFIRMED",type(e).__name__,str(e)[:100])
          PY
