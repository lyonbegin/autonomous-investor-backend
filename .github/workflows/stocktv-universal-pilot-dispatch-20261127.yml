name: Stop TradingView pilot and disable related workflows
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stocktv-universal-pilot-dispatch-20261127.yml']
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Disable stock-tv research and cancel the specific pilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow disable stock-tv-task-isolated-research.yml --repo "$GITHUB_REPOSITORY"
          status=$(gh run view 45971247658 --repo "$GITHUB_REPOSITORY" --json status --jq .status)
          if [ "$status" != completed ]; then
            gh run cancel 45971247658 --repo "$GITHUB_REPOSITORY"
          fi
          gh workflow disable stocktv-universal-pilot-dispatch-20261127.yml --repo "$GITHUB_REPOSITORY"
