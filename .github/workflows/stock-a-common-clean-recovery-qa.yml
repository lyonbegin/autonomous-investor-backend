name: stock-a common clean recovery QA
on:
  push:
    branches: [fix/stock-a-clean-worker-recovery-20261122]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact task recovery and checkpoint invariants
        run: |
          set -euo pipefail
          python3 -m py_compile research/hitel_a_task_isolated.py
          PYTHONPATH=research python3 research/test_hitel_a_clean_recovery.py -v
