name: Predeploy Full Install Verification

on:
  push:
    branches: [predeploy-verify]
    paths:
      - ".github/workflows/predeploy-full-install.yml"
  workflow_dispatch:

jobs:
  full-install:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build exact deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: autonomous-investor:predeploy
          cache-from: type=gha,scope=autonomous-investor-predeploy
          cache-to: type=gha,mode=max,scope=autonomous-investor-predeploy

      - name: Start image
        run: |
          set -euxo pipefail
          docker run -d --name autonomous-investor-predeploy -p 18080:8080 -e PORT=8080 autonomous-investor:predeploy
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              echo
              echo HEALTH_OK
              exit 0
            fi
            sleep 2
          done
          docker logs autonomous-investor-predeploy
          exit 1

      - name: Verify twelve runtime integrations
        run: |
          set -euxo pipefail
          curl --fail --silent "http://127.0.0.1:18080/api/v1/integrations?probe_runtime=true" | tee /tmp/integrations.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/integrations.json"))
          assert p["count"] == 12, p
          failures=[x for x in p["integrations"] if not x.get("installed") or not x.get("import_ok")]
          assert not failures, failures
          print("PREDEPLOY_ALL_TWELVE_RUNTIME_OK")
          PY

      - name: Verify pip environment inside image
        run: |
          set -euxo pipefail
          docker exec autonomous-investor-predeploy python -m pip check
          docker exec autonomous-investor-predeploy python scripts/verify_integrated_stack.py

      - name: Logs
        if: always()
        run: docker logs autonomous-investor-predeploy || true
