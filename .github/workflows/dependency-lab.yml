name: dependency-lab

on:
  push:
    branches: [dependency-lab]
    paths:
      - ".github/workflows/dependency-lab.yml"
      - "requirements/**"
      - "scripts/dependency_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  individual:
    name: individual / ${{ matrix.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: tradingagents
            install: "git+https://github.com/TauricResearch/TradingAgents.git@main"
            module: tradingagents.graph.trading_graph
            symbols: TradingAgentsGraph
          - key: finrobot
            install: "finrobot @ git+https://github.com/AI4Finance-Foundation/FinRobot.git@master#subdirectory=finrobot_desktop"
            module: finrobot.engine.pipelines.runner
            symbols: Pipeline
          - key: rdagent
            install: "git+https://github.com/microsoft/RD-Agent.git@main"
            module: rdagent.app.qlib_rd_loop.quant
            symbols: QuantRDLoop
          - key: qlib
            install: "git+https://github.com/microsoft/qlib.git@main"
            module: qlib
            symbols: ""
          - key: chronos
            install: "git+https://github.com/amazon-science/chronos-forecasting.git@main"
            module: chronos
            symbols: BaseChronosPipeline
          - key: sb3
            install: "git+https://github.com/DLR-RM/stable-baselines3.git@master"
            module: stable_baselines3.common.base_class
            symbols: BaseAlgorithm
          - key: rllib
            install: "ray[rllib]"
            module: ray.rllib
            symbols: ""
          - key: vectorbt
            install: "git+https://github.com/polakowo/vectorbt.git@master"
            module: vectorbt.portfolio.base
            symbols: Portfolio
          - key: finrl
            install: "git+https://github.com/AI4Finance-Foundation/FinRL-Trading.git@master"
            module: src.strategies.base_strategy
            symbols: StrategyResult BaseStrategy
          - key: riskfolio
            install: "git+https://github.com/dcajasn/Riskfolio-Lib.git@master"
            module: riskfolio
            symbols: Portfolio
          - key: pyportfolioopt
            install: "git+https://github.com/PyPortfolio/PyPortfolioOpt.git@main"
            module: pypfopt.efficient_frontier
            symbols: EfficientFrontier
          - key: nautilus
            install: "--pre nautilus-trader"
            module: nautilus_trader
            symbols: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install -U pip setuptools wheel
      - name: Install backend base
        run: |
          python -m pip install -c requirements/integration-constraints.txt -r requirements.txt
          python -m pip check
      - name: Install upstream
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -c requirements/integration-constraints.txt ${{ matrix.install }}
          python -m pip check
      - name: Probe import
        shell: bash
        run: |
          python scripts/dependency_probe.py             "${{ matrix.key }}"             "${{ matrix.module }}"             ${{ matrix.symbols }}
      - name: Freeze resolved environment
        run: python -m pip freeze

  cumulative:
    name: cumulative integration
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install -U pip setuptools wheel
      - name: Install backend base
        run: |
          python -m pip install -c requirements/integration-constraints.txt -r requirements.txt
          python -m pip check
      - name: Cumulative install and check
        shell: bash
        run: |
          set +e
          mkdir -p dependency-lab-logs
          install_one() {
            key="$1"; module="$2"; symbols="$3"; shift 3
            echo "===== BEGIN $key =====" | tee -a dependency-lab-logs/summary.txt
            python -m pip install -c requirements/integration-constraints.txt "$@"               >"dependency-lab-logs/$key-install.log" 2>&1
            rc=$?
            echo "install_rc=$rc" | tee -a dependency-lab-logs/summary.txt
            if [ "$rc" -eq 0 ]; then
              python -m pip check >"dependency-lab-logs/$key-pip-check.log" 2>&1
              check_rc=$?
              echo "pip_check_rc=$check_rc" | tee -a dependency-lab-logs/summary.txt
              python scripts/dependency_probe.py "$key" "$module" $symbols                 >"dependency-lab-logs/$key-probe.log" 2>&1
              probe_rc=$?
              echo "probe_rc=$probe_rc" | tee -a dependency-lab-logs/summary.txt
            fi
            echo "===== END $key =====" | tee -a dependency-lab-logs/summary.txt
          }

          install_one tradingagents tradingagents.graph.trading_graph "TradingAgentsGraph"             "git+https://github.com/TauricResearch/TradingAgents.git@main"
          install_one finrobot finrobot.engine.pipelines.runner "Pipeline"             "finrobot @ git+https://github.com/AI4Finance-Foundation/FinRobot.git@master#subdirectory=finrobot_desktop"
          install_one rdagent rdagent.app.qlib_rd_loop.quant "QuantRDLoop"             "git+https://github.com/microsoft/RD-Agent.git@main"
          install_one qlib qlib ""             "git+https://github.com/microsoft/qlib.git@main"
          install_one chronos chronos "BaseChronosPipeline"             "git+https://github.com/amazon-science/chronos-forecasting.git@main"
          install_one sb3 stable_baselines3.common.base_class "BaseAlgorithm"             "git+https://github.com/DLR-RM/stable-baselines3.git@master"
          install_one rllib ray.rllib "" "ray[rllib]"
          install_one vectorbt vectorbt.portfolio.base "Portfolio"             "git+https://github.com/polakowo/vectorbt.git@master"
          install_one finrl src.strategies.base_strategy "StrategyResult BaseStrategy"             "git+https://github.com/AI4Finance-Foundation/FinRL-Trading.git@master"
          install_one riskfolio riskfolio "Portfolio"             "git+https://github.com/dcajasn/Riskfolio-Lib.git@master"
          install_one pyportfolioopt pypfopt.efficient_frontier "EfficientFrontier"             "git+https://github.com/PyPortfolio/PyPortfolioOpt.git@main"

          python -m pip install -c requirements/integration-constraints.txt --pre nautilus-trader             >dependency-lab-logs/nautilus-install.log 2>&1
          rc=$?
          echo "nautilus install_rc=$rc" | tee -a dependency-lab-logs/summary.txt
          if [ "$rc" -eq 0 ]; then
            python -m pip check >dependency-lab-logs/nautilus-pip-check.log 2>&1
            python scripts/dependency_probe.py nautilus nautilus_trader               >dependency-lab-logs/nautilus-probe.log 2>&1
          fi

          python -m pip freeze > dependency-lab-logs/final-freeze.txt
          cat dependency-lab-logs/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lab-logs
          path: dependency-lab-logs/
