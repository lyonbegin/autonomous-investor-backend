name: DDDS source 502 recovery pinned SHA 141 lines
on:
  push:
    branches: [feature/ddds-pinned-public-source-502-recovery-20261104]
  pull_request:
    branches: [public-platform]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install only current public API production deps
        run: python -m pip install -r public_api/requirements.txt
      - name: Confirm source SHA, API 502 fallback and no other-script fallback
        run: python -m unittest discover -s public_api/tests -p 'test_ddds_pinned_public_api.py' -v
      - name: Compile public API
        run: python -m py_compile public_api/main.py public_api/pinned_ddds_source.py
