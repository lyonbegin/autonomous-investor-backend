name: autonomous-investment-n8n

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: invest_n8n
  DB_POSTGRESDB_USER: invest_n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_RUNNERS_ENABLED: "false"
  N8N_SECURE_COOKIE: "false"  # localhost HTTP ONLY
  N8N_HOST: localhost
  N8N_PROTOCOL: http
  N8N_PORT: "5678"
  N8N_LOG_LEVEL: info
  # n8n 2.x otherwise blocks $env in expressions. ADMIN-ONLY isolated instance!
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  INVESTMENT_SCENARIO_CALLBACK_KEY: ${INVESTMENT_SCENARIO_CALLBACK_KEY:?set scenario callback secret}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: invest_n8n
      POSTGRES_USER: invest_n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set postgres secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U invest_n8n -d invest_n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: n8n_scenarios/Dockerfile.api
    restart: unless-stopped
    environment:
      ALPHA_NODE_API_KEY: ${ALPHA_NODE_API_KEY:?set private API key}
      INVESTMENT_SCENARIO_CALLBACK_KEY: ${INVESTMENT_SCENARIO_CALLBACK_KEY:?set callback key}
      INVESTMENT_N8N_WEBHOOK_BASE: http://n8n:5678/webhook
      INVESTMENT_SCENARIO_DB_PATH: /data/scenarios.sqlite3
      INVESTMENT_FLOW_DB_PATH: /data/investment_workflows.sqlite3
      ALPHA_ALLOW_RESEARCH: "false"
      ALPHA_ALLOW_TRAINING: "false"
      ALPHA_ALLOW_QUANT_WRITES: "false"
    volumes:
      - scenario_data:/data
    ports:
      - "127.0.0.1:8000:8000"

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.45.0}
    restart: unless-stopped
    environment: *n8n-env
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.45.0}
    restart: unless-stopped
    command: worker --concurrency=5
    environment: *n8n-env
    depends_on:
      n8n:
        condition: service_started

  n8n-import:
    profiles: ["bootstrap"]
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.45.0}
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        set -eu
        n8n import:workflow --separate --input=/workflows
        for number in 01 02 03 04 05 06 07 08 09 10; do
          n8n publish:workflow --id="INVESTSCENARIO$number"
        done
        echo "Imported and published 10 synthetic investment n8n workflows."
    environment: *n8n-env
    volumes:
      - ./workflows:/workflows:ro
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  studio:
    image: node:22-alpine
    working_dir: /studio
    restart: unless-stopped
    volumes:
      - ../investment_studio:/studio
      - studio_node_modules:/studio/node_modules
    environment:
      INVESTMENT_STUDIO_BACKEND_URL: http://api:8000
      INVESTMENT_STUDIO_API_TOKEN: ${ALPHA_NODE_API_KEY:?set private API key}
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5177:5177"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  scenario_data:
  studio_node_modules:
