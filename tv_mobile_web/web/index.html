<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fafd"><meta name="color-scheme" content="light dark">
<title>Mobile Markets Lab · Android 기능 대응 검증</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/market_home.css">
<script defer src="/assets/feature_registry.js"></script>
<script defer src="/assets/world_catalog.js"></script>
<script defer src="/assets/market_home_data.js"></script>
<script defer src="/assets/market_chart.js"></script>
<script defer src="/assets/market_detail.js"></script>
<script defer src="/assets/market_home.js"></script>
<script defer src="/assets/market_live.js"></script>
<script defer src="/assets/app.js"></script>
</head><body>
<div class="app-shell">
<header class="topbar">
  <div class="top-left"><span class="brand-mark">⌁</span><span class="brand-name">Market<span>Lab</span></span><span class="mode-tag">분리 개발</span></div>
  <div class="top-actions">
    <button type="button" class="icon-btn" id="globalSearchButton" title="전체 검색" aria-label="검색"><span>⌕</span></button>
    <button type="button" class="icon-btn" id="alertsButton" title="알림" aria-label="알림">♧</button>
    <button type="button" class="avatar" id="accountButton" title="프로필" aria-label="프로필">◉</button>
  </div>
</header>
<div class="top-context"><div id="breadcrumbs">마켓</div><div id="dataConnection">기존 TradingView 데이터 서비스 연결</div></div>
<div class="workspace">
 <aside class="desktop-nav" aria-label="앱 전체 내비게이션">
   <div class="sidebar-title">앱 기능</div>
   <div class="nav-group" id="desktopNav"></div>
   <div class="sidebar-title extra">전체 기능 영역 · 26개</div>
   <div id="desktopDomains" class="desktop-domains"></div>
   <div class="side-notice">원본 APK 339개 기능 후보<br>동등성 검증 진행 중 · 완료 아님</div>
 </aside>
 <main class="content" id="view" tabindex="-1" aria-live="polite">
  <div class="screen-loading">화면을 불러오는 중입니다.</div>
 </main>
</div>
<nav id="mobileNav" class="mobile-bottom" aria-label="하단 주요 메뉴"></nav>
</div>

<div class="overlay" id="searchOverlay" hidden>
 <section class="search-panel" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
  <header class="overlay-head"><button id="closeSearch" class="plain-icon" aria-label="뒤로">←</button><h2 id="searchTitle">종목 검색</h2><span class="flex-fill"></span></header>
  <div class="search-form"><label for="searchTerm" class="sr-only">종목 또는 심볼 검색</label><input id="searchTerm" placeholder="종목명, 거래소:심볼" autocomplete="off"><button id="clearSearch" class="ghost-btn">지우기</button></div>
  <p class="hint">현재 선택된 시장에서 실제 조회된 첫 페이지 데이터 중 검색합니다. 전 세계 통합 검색은 미연결 상태입니다.</p>
  <div class="search-results" id="searchResults"><div class="empty-state">검색어를 입력해 주세요.</div></div>
 </section>
</div>
<div class="overlay" id="modalOverlay" hidden><div id="modalCard" class="modal-card" role="dialog" aria-modal="true" aria-live="polite"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<template id="statusPill"><span class="status-pill">상태 확인 필요</span></template>
</body></html>
