[project]
name = "autonomous-investor-backend"
version = "0.1.0"
description = "Backend integration runtime for the Autonomous Investor Agent"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.12,<3.0",
  "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["lab*", "tests*", "scripts*"]
