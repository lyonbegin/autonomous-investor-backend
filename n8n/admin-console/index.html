async function publishVerifiedStrategy(target){

 try{
   const result=await api('/api/investment/verified-scripts/publish',{
       method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
   if(!result.ok)throw Error(JSON.stringify(result.data));
   if(message)message.textContent='검증 통과 전략 누적 등록 완료 · '+data.source_id;

   const frame=document.getElementById('verified-strategies-frame');
   if(frame?.contentWindow)frame.contentWindow.postMessage({
       type:'INVESTMENT_APPROVED_CATALOG_UPDATED'},location.origin);

   if(message)message.textContent='등록 실패 · '+String(e).slice(0,240);

function exportVerifiedDDDSTrades(){
 const d=verifiedDDDSReference;
 if(!d||d.capture_verified_complete!==true||d.observed_trade_count!==299||
    d.trades?.length!==299||
    d.pine_source_sha256!==lastPublishedSourceSha||
    d.tradingview_pynecore_parity_verified!==false)return;
 const columns=['trade_number','side','entry_time_display','exit_time_display',
   'entry_price_display','exit_price_display','quantity_display',
   'net_pnl_display','return_percent_display','pine_source_sha256'];
 const headers=['trade_number','side','entry_time_display_timezone_unspecified',
   'exit_time_display_timezone_unspecified','entry_price_usd','exit_price_usd',
   'quantity','net_pnl_usd','return_percent','pine_source_sha256'];
 const csvCell=v=>{
   const raw=v===null||v===undefined?'':String(v);
   const safe=/^[=+@]/.test(raw)?"'"+raw:raw;
   return '"'+safe.replaceAll('"','""')+'"';
 };
 const rows=[headers.map(csvCell).join(',')];
 for(const trade of d.trades){
   const values=columns.map(k=>k==='pine_source_sha256'?d.pine_source_sha256:trade[k]);
   rows.push(values.map(csvCell).join(','));
 }
 const text='\uFEFF'+rows.join('\r\n')+'\r\n';
 const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
 const link=document.createElement('a');link.href=url;
 link.download='DDDS_BATS-AMZN_2h_TradingView_published_299_trades.csv';
 document.body.append(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}

 anchor.href=object;anchor.download='DDDS_141_PYNE_free_generated_'+sha.slice(0,12)+'.py';
 document.body.append(anchor);anchor.click();anchor.remove();
 setTimeout(()=>URL.revokeObjectURL(object),1000);

function plotOfficialChart(target,rows,keys){
 const node=document.getElementById(target);if(!node)return;
 while(node.firstChild)node.removeChild(node.firstChild);
 if(!Array.isArray(rows)||rows.length<2)return;
 const ns='http://www.w3.org/2000/svg',w=840,h=280,p=33;
 const numbers=rows.flatMap(r=>keys.map(k=>r[k])).filter(x=>Number.isFinite(x));
 if(!numbers.length)return;
 const low=Math.min(...numbers),high=Math.max(...numbers),spread=Math.max(high-low,0.001);
 const x=i=>p+(w-p*2)*i/(rows.length-1);
 const y=v=>h-p-(v-low)/spread*(h-2*p);
 const hues=['#dbeafe','#38bdf8','#f7a96b','#34d399'];
 for(let n=0;n<5;n++){const line=document.createElementNS(ns,'line');const yy=p+n*(h-2*p)/4;
 line.setAttribute('x1',p);line.setAttribute('x2',w-p);line.setAttribute('y1',yy);line.setAttribute('y2',yy);
 line.setAttribute('stroke','#28415c');node.append(line);}
 keys.forEach((key,j)=>{let started=false,d='';
  rows.forEach((r,i)=>{const v=r[key];if(!Number.isFinite(v)){started=false;return;}
   d+=(started?' L':' M')+x(i).toFixed(1)+','+y(v).toFixed(1);started=true;});
  const shape=document.createElementNS(ns,'path');shape.setAttribute('d',d);shape.setAttribute('fill','none');
  shape.setAttribute('stroke',hues[j%hues.length]);shape.setAttribute('stroke-width','2');node.append(shape);
  const label=document.createElementNS(ns,'text');label.setAttribute('x',p+j*130);label.setAttribute('y','21');
  label.setAttribute('fill',hues[j%hues.length]);label.setAttribute('font-size','12');label.textContent=key;node.append(label);
 });
}

   }

    lastSavedSource={source_id:d.input_json.candidate.source_id,version_key:d.input_json.candidate.version_key,source_url:d.input_json.candidate.source_url};
   }
   if(flow===W.pine&&id==='wf02-01'&&d.output_json?.pine_code)lastPine=d.output_json;
   prevRun=d.run_id;step++;
   const next=nextNode(node,d);
   if(!next){
    complete=true;const output=d.output_json||{};
    if(flow===W.pine){
      if(output.status==='PYNE_FREE_GENERATED_UNVALIDATED'){
       if(progress)progress.textContent='무료 PYNE Python 코드 생성·저장 완료 · DDDS 체결 일치 미검증';
       log('DDDS 동일 Pine을 무료 PYNE 로컬 컴파일로 변환·저장했습니다. Python SHA: '+(output.python_sha256||'없음')+'. TradingView 거래 일치 검증과는 별개입니다.','green');
       await refreshFreePYNEArtifact();
      }else if(output.status==='UNSUPPORTED_PINE'){
       if(progress)progress.textContent='Pine 문법 미지원 · 변환 불가 (정상 차단)';
       log('미지원 Pine · '+(output.unsupported_reason||output.basic_converter_reason||'지원 범위 밖'),'red');
      }else{
       const blocked=String(output.status||'UNKNOWN');
       if(progress)progress.textContent='변환 차단 · '+blocked;
       log('DDDS 무료 PYNE Python 변환이 실제 차단됐습니다. 이유: '+blocked,'red');
       const comparison=document.getElementById('publication-python-state');
       if(comparison)comparison.textContent='DDDS 원본 Pine → 무료 PYNE 변환 차단 · '+blocked+
         ' · 다른 SMA 전략 결과로 대체하지 않습니다.';
      }
    }else{
      if(progress)progress.textContent='원본 확보·저장 실행 종료 · '+step+'개 실제 노드';
      log('원본 코드 저장 처리 결과: '+(output.status||'미확인')+'. Python 차트/매매 신호 일치 여부와는 별개입니다.','green');
      if(output.source_id&&output.version_key&&lastSavedSource){lastSavedSource={...lastSavedSource,source_id:output.source_id,version_key:output.version_key};}
      if(output.status==='PINE_SAVED_CONVERSION_PENDING'&&flow===W.strategy){
       const details=document.getElementById('node-details');
       if(details)details.insertAdjacentHTML('afterend','<div class="actions"><button class="btn primary" data-action="convert-next">↗ 이 전략으로 WF-02 Python 변환</button></div>');
      }
    }
    await inspect(id);break;
   }
   node=next;
  }
  if(!complete&&step>=35){
    log('35단계 실행 상한에 도달해 중단했습니다.','red');
    const progress=document.getElementById('progress');if(progress)progress.textContent='단계 상한 도달 · 중단';
  }
 }catch(e){
  log('요청 또는 실행 오류: '+e.message,'red');
  const progress=document.getElementById('progress');if(progress)progress.textContent='실행 오류 · 중단';
 }finally{
  running=false;const b=document.getElementById('run');if(b)b.disabled=false;await refreshSavedState();
 }
}
