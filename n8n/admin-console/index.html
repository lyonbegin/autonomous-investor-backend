 fpanel.innerHTML='<h3>'+esc(flowLabels[f]||workflow.name)+'</h3><div class="actions">'+link(f,'기존 노드 캔버스 열기')+
 '<button class="btn small" data-action="refresh">실행 이력 새로고침</button></div><p class="muted minor">원본 '+esc(workflow.nodes.length)+
 '개 노드 · 실제 실행 상태는 서버 기록 기반'+(isStrategy?' · 승인된 과거 GitHub 목록을 사용하며 TradingView 실시간 최신 목록은 아닙니다.':'')+'</p><div class="node-list" id="node-list"></div>';
 if(exec){
  if(isStrategy||isLibrary||isPython){
   const libraryFields=isLibrary?'<div class="notice warn">자동 라이브러리 목록 공급원은 아직 연결되지 않았습니다. 실제로 확보한 TradingView 공개 라이브러리 코드를 아래에 입력하면 별도의 <b>사용자 제공 원본 등록</b> 경로로 실행합니다. 가짜 최신 수집으로 표시하지 않습니다.</div>'+
    '<label class="form-field">TradingView 공개 라이브러리 URL<input class="form-control" id="library-url" placeholder="https://www.tradingview.com/script/XXXXXXXX/"></label>'+
    '<label class="form-field">원본 버전<input class="form-control" id="library-version" value="1" placeholder="예: 1"></label>'+
    '<label class="form-field">실제 Pine library() 전체 코드<textarea class="form-control" id="library-pine" rows="7" placeholder="//@version=6&#10;library(&quot;...&quot;)&#10;export ..."></textarea></label>':'';
   const pythonInfo=isPython?'<div class="notice">WF-01에서 SQLite에 저장된 최신 전략 원본 1개를 읽어 Python으로 변환합니다. 지원되지 않는 Pine은 미지원 판정으로 남으며 자동 성공 처리하지 않습니다.</div>'+
     '<label class="form-field">특정 저장 전략 source_id (선택)<input class="form-control" id="wf02-source-id" placeholder="미입력 시 가장 최근 저장 원본"></label>'+
     '<label class="form-field">해당 원본 version_key (source_id와 함께 입력)<input class="form-control" id="wf02-version" placeholder="예: 1.0"></label>'+
     '<div class="actions"><button class="btn" data-action="compare">↗ 저장 Pine으로 좌우 차트 비교 열기</button></div>':'';
   exec.innerHTML='<section class="panel"><h3>'+(isPython?'WF-02 · Pine→Python 실제 노드 실행':'WF-01 · Pine 원본 확보·저장 실제 노드 실행')+'</h3>'+
    '<p class="helper">서버의 실제 Python 노드를 순차 실행하며 입력·출력 JSON, SQLite 저장 이력과 실패 지점을 확인할 수 있습니다.</p>'+libraryFields+pythonInfo+
    '<div class="actions"><button class="btn primary" id="run" data-action="run">▶ '+(isLibrary?'제공한 라이브러리 등록 실행':isPython?'저장 Pine → Python 변환 실행':'전략 수집 검증 실행')+
    '</button><button class="btn" data-action="refresh">서버 이력 조회</button><span class="status" id="progress">실행 전</span></div></section>'+
    '<div class="grid2"><section class="panel"><h3>실제 실행 단계 기록</h3><div id="run-log" class="log">실행 버튼으로 서버 응답을 확인하세요.</div></section>'+
    '<section class="panel"><h3>선택한 노드의 실제 입력·출력</h3><div id="node-details" class="muted">위 노드 목록에서 확인할 항목을 선택하세요.</div></section></div>';
  }else if(isParity){
   exec.innerHTML='<section class="panel"><h3>원본 TradingView ↔ Python 전략 차트 비교</h3>'+
    '<p class="helper">기존 별도 비교 페이지는 왼쪽에 TradingView에서 직접 확보한 실제 전략 적용 차트, 오른쪽에 동일한 OHLC 데이터를 이용한 Python SVG 차트를 보여줍니다. 차트 중첩·신호 비교와 결과 이력을 제공합니다.</p>'+
    '<div class="notice warn">원본 TradingView 화면 캡처와 가격·플롯 CSV는 자동으로 수집되지 않습니다. 실제 캡처·CSV를 제공하지 않으면 수치 및 시각 동등성 확인은 미완료입니다.</div>'+
    '<div class="actions"><button class="btn primary" data-action="compare">↗ 저장된 Pine을 불러와 좌우 차트 비교</button>'+
    '<a class="btn" href="'+PARITY_ORIGIN+'/" target="_blank" rel="noopener noreferrer">↗ 차트 비교 페이지 직접 열기</a>'+link(f,'8개 노드 흐름 열기')+'</div>'+
    '<p class="muted minor">차트 입력·계산·렌더링은 '+esc(PARITY_ORIGIN)+'/api/compare 에서 수행하고 마지막 08 노드에서 동일 실행 ID의 결과 페이지로 연결됩니다.</p></section>';
  }else{
   exec.innerHTML='<section class="panel"><h3>이 워크플로의 실행 검증 상태</h3><p class="muted">현재 독립 실행 API는 연결되지 않았습니다. 기존 편집기의 노드 설정과 연결을 확인하세요.</p>'+link(f)+'</section>';
  }
 }
 renderNodes();await refreshSavedState();
}
async function latestStoredPine(){
 if(lastPine?.pine_code)return lastPine;
 const params=new URLSearchParams({workflow:W.pine,node_id:'wf02-01'});
 const response=await api('/api/studio/nodes/history?'+params);
 if(!response.ok)throw Error('저장 Pine 실행 이력 조회 실패');
 const row=(response.data.executions||[]).find(x=>x.status==='SUCCESS'&&x.output_json?.pine_code);
 if(!row)throw Error('WF-02에서 저장된 Pine 읽기를 먼저 실행하세요. 또는 비교 페이지에서 Pine 코드를 직접 입력하세요.');
 lastPine=row.output_json;return lastPine;
}
async function openCompare(){
 try{
  const result=await latestStoredPine();
  if(!result?.pine_code)throw Error('실제 저장된 Pine 코드가 없습니다.');
  compareWindow=window.open(PARITY_ORIGIN+'/?from=investment-admin','_blank');
  if(!compareWindow)throw Error('브라우저 팝업 차단을 해제하거나 비교 페이지를 직접 여세요.');
  pendingCompare={pine_code:result.pine_code,source_id:result.source_id||'',version_key:result.version_key||''};
  const progress=document.getElementById('progress');if(progress)progress.textContent='저장 Pine을 차트 비교 페이지에 전달';
 }catch(e){alert(e.message);}
}
function renderNodes(){const el=document.getElementById('node-list');if(!el||!workflow)return;el.innerHTML=workflow.nodes.map(n=>{const s=session[n.id]||{};return '<button class="step '+(s.status==='SUCCESS'?'success':s.status==='FAILED'?'failed':s.status==='RUNNING'?'running':'')+' '+(selectedNode===n.id?'selected':'')+'" data-node="'+esc(n.id)+'"><span><b>'+esc(n.name)+'</b><small>'+esc(n.id)+'</small></span><em>'+esc(s.status==='SUCCESS'?'✓ 실제 완료':s.status==='FAILED'?'✕ 실제 실패':s.status==='RUNNING'?'● 실행 중':'조회 가능')+'</em></button>'}).join('')}
async function refreshSavedState(){if(!workflow)return;try{const r=await api('/api/studio/nodes/graph-state?'+new URLSearchParams({workflow:flow}));if(r.ok){const states=r.data.nodes||[];const note=document.getElementById('progress');if(note&&!runEvents.length)note.textContent='SQLite 최근 노드 기록 '+states.length+'개 (현재 실행과 구분)';}}catch{}}
async function inspect(id){selectedNode=id;renderNodes();const box=document.getElementById('node-details')||document.getElementById('flow-panel');if(!box)return;const info=workflow?.nodes?.find(n=>n.id===id);if(!info)return;let data=session[id]?.data;let historical=false;if(!data){try{let r=await api('/api/studio/nodes/history?'+new URLSearchParams({workflow:flow,node_id:id}));data=r.data.executions?.[0];historical=true}catch(e){box.textContent='실행 이력 조회 실패: '+e.message;return}}if(!data){box.textContent='기록된 실행이 없습니다.';return;}box.innerHTML='<h4>'+esc(info.name)+'</h4><p class="muted minor">'+(historical?'이 노드의 SQLite 최근 실행 (이번 테스트와 다를 수 있음)':'이번 테스트에서 받은 실제 API 응답')+'</p><p class="minor">상태 '+esc(data.status)+' · 실행 ID '+esc(data.run_id||'없음')+' · 소요 '+esc(data.duration_ms??'미기록')+'ms</p><h4>실제 INPUT JSON</h4><pre class="code" id="input-json"></pre><h4>실제 OUTPUT JSON</h4><pre class="code" id="output-json"></pre><h4>오류 / 차단 원인</h4><pre class="code" id="error-json"></pre>';document.getElementById('input-json').textContent=JSON.stringify(data.input_json??null,null,2);document.getElementById('output-json').textContent=JSON.stringify(data.output_json??null,null,2);document.getElementById('error-json').textContent=data.error||'기록 없음'}
function nextNode(current,result){let edges=workflow.connections?.[current.name]?.main||[];let ports=result.output_json?._studio_active_ports;if(!Array.isArray(ports))ports=[0];for(const port of ports){const conn=(edges[port]||[])[0];if(!conn)continue;return workflow.nodes.find(n=>n.name===conn.node)||null}return null}
function log(s,type=''){runEvents.push({s,type});let el=document.getElementById('run-log');if(el){el.innerHTML=runEvents.map(x=>'<div class="'+esc(x.type)+'">'+esc(x.s)+'</div>').join('');el.scrollTop=el.scrollHeight}}
async function executeFlow(){
 if(running||!workflow||![W.strategy,W.library,W.pine].includes(flow))return;
 let input,rootId;
 if(flow===W.pine){
  input={ui_selection:'strategy',requested_detail_limit:1};rootId='wf02-01';
  const sid=document.getElementById('wf02-source-id')?.value.trim()||'';
  const version=document.getElementById('wf02-version')?.value.trim()||'';
  if(Boolean(sid)!==Boolean(version)){
   const progress=document.getElementById('progress');
   if(progress)progress.textContent='특정 원본 선택 시 source_id와 version_key를 모두 입력하세요.';
   return;
  }
  if(sid){input.source_id=sid;input.version_key=version;}
 }else{
  const kind=flow===W.library?'library':'strategy';
  input={ui_selection:kind,requested_detail_limit:1,max_pages:3};rootId='wf01-'+kind+'-01';
  if(flow===W.library){
   const source_url=document.getElementById('library-url')?.value.trim();
   const version_key=document.getElementById('library-version')?.value.trim();
   const pine_code=document.getElementById('library-pine')?.value||'';
   if(!source_url||!version_key||!pine_code.trim()){
    const progress=document.getElementById('progress');
    if(progress)progress.textContent='실제 라이브러리 URL·버전·Pine 원본을 입력해야 실행할 수 있습니다.';
    return;
   }
   input.manual_library={source_url,version_key,pine_code};
  }
 }
 running=true;session={};runEvents=[];renderNodes();
 const button=document.getElementById('run');if(button)button.disabled=true;
 let node=workflow.nodes.find(n=>n.id===rootId),prevRun=null,step=0,complete=false;
 log('시작 · '+flow+' · 등록된 Python 실제 노드 실행');
 try{
  if(!node)throw Error('등록된 시작 노드가 없습니다.');
  while(node&&step<35){
   const id=node.id;session[id]={status:'RUNNING'};renderNodes();
   const progress=document.getElementById('progress');if(progress)progress.textContent='실행 중 · '+node.name;
   const body=prevRun?{workflow:flow,node_id:id,source_run_id:prevRun}:{workflow:flow,node_id:id,input_json:input};
   const path=prevRun?'/api/studio/nodes/execute':'/api/studio/node01/execute';
   const r=await api(path,{method:'POST',
      headers:{'Content-Type':'application/json','X-Studio-Node-Run':prevRun?'APPROVED':'N01'},
      body:JSON.stringify(body)});
   const d=r.data;
   session[id]={status:d.status||'FAILED',data:d};
   log(node.name+' · HTTP '+r.status+' · '+(d.status||'오류')+' · '+(d.run_id||'실행 ID 없음'),r.ok?'green':'red');
   renderNodes();
   if(!r.ok||d.status!=='SUCCESS'||!d.run_id){
    if(progress)progress.textContent='중단 · '+node.name;
    log('실제 오류: '+(d.error||'HTTP '+r.status),'red');await inspect(id);break;
   }
   if(flow===W.pine&&id==='wf02-01'&&d.output_json?.pine_code)lastPine=d.output_json;
   prevRun=d.run_id;step++;
   const next=nextNode(node,d);
   if(!next){
    complete=true;const output=d.output_json||{};
    if(flow===W.pine){
      if(output.status==='PYTHON_GENERATED'){
       if(progress)progress.textContent='Python 코드 생성 · 실제 TradingView 동등성은 별도 검증 필요';
       log('Python 변환 코드 생성 성공. 좌우 차트 비교에서 실제 TV 캡처와 플롯 CSV를 사용해 검증하세요.','green');
      }else if(output.status==='UNSUPPORTED_PINE'){
       if(progress)progress.textContent='Pine 문법 미지원 · 변환 불가 (정상 차단)';
       log('미지원 Pine · '+(output.unsupported_reason||output.basic_converter_reason||'지원 범위 밖'),'red');
      }else{if(progress)progress.textContent='완료 · '+String(output.status||'미확인');}
    }else{
      if(progress)progress.textContent='원본 확보·저장 실행 종료 · '+step+'개 실제 노드';
      log('원본 코드 저장 처리 결과: '+(output.status||'미확인')+'. Python 차트/매매 신호 일치 여부와는 별개입니다.','green');
    }
    await inspect(id);break;
   }
   node=next;
  }
  if(!complete&&step>=35){
    log('35단계 실행 상한에 도달해 중단했습니다.','red');
    const progress=document.getElementById('progress');if(progress)progress.textContent='단계 상한 도달 · 중단';
  }
 }catch(e){
  log('요청 또는 실행 오류: '+e.message,'red');
  const progress=document.getElementById('progress');if(progress)progress.textContent='실행 오류 · 중단';
 }finally{
  running=false;const b=document.getElementById('run');if(b)b.disabled=false;await refreshSavedState();
 }
}
menu.innerHTML=MENUS.map(([id,label])=>'<button class="nav" data-page="'+esc(id)+'"><span>▧</span>'+esc(label)+'</button>').join('');
document.addEventListener('click',e=>{const target=e.target.closest('[data-page],[data-flow],[data-node],[data-action]');if(!target)return;if(target.dataset.page)setPage(target.dataset.page);else if(target.dataset.flow)loadFlow(target.dataset.flow);else if(target.dataset.node)inspect(target.dataset.node);else if(target.dataset.action==='run')executeFlow();else if(target.dataset.action==='compare')openCompare();else if(target.dataset.action==='refresh')loadFlow(flow)});
