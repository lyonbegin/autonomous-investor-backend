services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - n8n_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${N8N_REDIS_PASSWORD:?Set N8N_REDIS_PASSWORD}"]
    volumes:
      - n8n_redis:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.0
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports:
      - "127.0.0.1:5678:5678"
    environment: &n8n_env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PASSWORD: ${N8N_REDIS_PASSWORD:?Set N8N_REDIS_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_PORT: "5678"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
    volumes:
      - n8n_state:/home/node/.n8n

  worker:
    image: docker.n8n.io/n8nio/n8n:2.45.0
    restart: unless-stopped
    command: worker --concurrency=3
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      <<: *n8n_env
    volumes:
      - n8n_state:/home/node/.n8n

volumes:
  n8n_pg:
  n8n_redis:
  n8n_state:
